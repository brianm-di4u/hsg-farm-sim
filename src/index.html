<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valley of Vapors: Through the Ages</title>
<meta name="description" content="An original farming and life sim across six eras of the Hot Springs valley, Arkansas.">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="The farm and the valley" role="img"></canvas>
  <canvas id="nightfx" aria-hidden="true"></canvas>
  <div id="hud" hidden>
    <div class="hud-l panel-s">
      <div id="h-date" class="h-date"></div>
      <div class="h-row"><span id="h-time" class="h-time"></span><span id="h-wx" class="h-wx"></span></div>
    </div>
    <div id="h-quest" class="h-quest panel-s"></div>
    <div class="hud-r">
      <div class="panel-s h-stats">
        <div id="h-money" class="h-money"></div>
        <div class="h-energy" aria-label="Energy"><div class="bar"><i id="h-ebar"></i></div><span id="h-energy"></span></div>
      </div>
      <div class="h-btns">
        <button class="hbtn" data-act="open" data-arg="journal" title="Journal (L)" aria-label="Journal">📖</button>
        <button class="hbtn" data-act="open" data-arg="inventory" title="Pack and crafting (I)" aria-label="Pack and crafting">🎒</button>
        <button class="hbtn" data-act="open" data-arg="pause" title="Menu (Esc)" aria-label="Menu">☰</button>
      </div>
    </div>
  </div>
  <div id="prompt" class="prompt" hidden></div>
  <div id="hotbar" class="hotbar" hidden></div>
  <div id="touch" hidden>
    <div id="pad" class="pad" aria-label="Movement pad"><i class="knob"></i></div>
    <div class="abtns">
      <button id="btn-b" class="tbtn tb-b" aria-label="Talk or interact">B<small>Talk</small></button>
      <button id="btn-a" class="tbtn tb-a" aria-label="Use tool or item">A<small>Use</small></button>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="screen" class="screen" hidden></div>
  <canvas id="wipe" hidden></canvas>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</div>
<!-- @inline ../data/facts.json as FACTS -->
<script type="module" src="js/main.js"></script>
</body>
</html>
