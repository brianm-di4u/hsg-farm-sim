<style>
/* Fonts: system stacks from shared/design/tokens.css. UI colors are set per chapter by ui.js. */
:root {
  --font-serif-victorian: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --font-deco: "Century Gothic", Futura, "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-frontier: Georgia, "Times New Roman", serif;
  --font-body-serif: Alegreya, Georgia, "Times New Roman", serif;
  --font-body-sans: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --disp-frontier: "IM Fell English", Georgia, serif;
  --disp-victorian: "Playfair Display", Georgia, serif;
  --disp-deco: "Josefin Sans", "Century Gothic", sans-serif;
  --disp-mid: Righteous, "Arial Black", sans-serif;
  --disp-modern: Outfit, system-ui, sans-serif;
  --ui-display: var(--disp-victorian);
  --ui-bg: #F2EFE8; --ui-fg: #1F2A24; --ui-accent: #A9432C; --ui-accent-fg: #fff; --ui-muted: #5A4C38; --ui-border: #D9A23A;
  --ui-font: var(--font-serif-victorian);
  --r: 10px;
  font-size: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #1a1612; color: var(--ui-fg); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
#nightfx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#wipe { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 30; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ui-accent); outline-offset: 2px; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px; pointer-events: none; z-index: 5; font-family: var(--ui-font); }
#hud > * { pointer-events: auto; }
.panel-s { background: var(--ui-bg); color: var(--ui-fg); border: 2px solid var(--ui-border); border-radius: var(--r); padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.hud-l { min-width: 9.5rem; }
.h-date { font-weight: 700; font-size: 1.02rem; font-family: var(--ui-display); letter-spacing: .01em; }
.h-row { display: flex; gap: 8px; align-items: center; font-size: 0.95rem; }
.h-time { font-variant-numeric: tabular-nums; font-weight: 700; }
.h-wx { color: var(--ui-muted); }
.h-quest { max-width: 22rem; font-size: 0.92rem; line-height: 1.28; }
.h-quest b { display: block; font-family: var(--ui-display); font-size: 0.82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ui-muted); }
.h-quest .q { display: flex; gap: 6px; }
.h-quest .q.done { color: var(--ui-muted); text-decoration: line-through; }
.hud-r { margin-left: auto; display: flex; gap: 8px; align-items: flex-start; }
.h-stats { min-width: 9rem; }
.h-money { font-weight: 700; font-size: 1.12rem; font-family: var(--ui-display); font-variant-numeric: tabular-nums; }
.h-energy { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.h-energy .bar { flex: 1; height: 10px; min-width: 70px; background: rgba(0,0,0,.25); border-radius: 5px; overflow: hidden; border: 1px solid var(--ui-fg); }
.h-energy .bar i { display: block; height: 100%; background: #4caf50; }
.h-energy.low .bar i { background: #e04a3a; }
.h-btns { display: flex; gap: 6px; }
.hbtn { width: 46px; height: 46px; border-radius: var(--r); border: 2px solid var(--ui-border); background: var(--ui-bg); font-size: 1.3rem; box-shadow: 0 2px 8px rgba(0,0,0,.35); }

/* Hotbar */
.hotbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: var(--ui-bg); border: 2px solid var(--ui-border); border-radius: var(--r); z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.slot { position: relative; width: 52px; height: 52px; border-radius: 8px; border: 2px solid transparent; background: rgba(0,0,0,.12); padding: 0; display: grid; place-items: center; }
.slot img { width: 40px; height: 40px; pointer-events: none; }
.slot .n { position: absolute; right: 1px; bottom: 1px; font-size: 0.72rem; font-weight: 700; color: #fff; background: rgba(16,14,12,.88); border-radius: 4px; padding: 0 3px; line-height: 1.25; font-family: var(--font-sans); }
.slot .k { position: absolute; left: 3px; top: 1px; font-size: 0.65rem; font-weight: 700; color: var(--ui-fg); font-family: var(--font-sans); }
.slot.sel { border-color: var(--ui-accent); background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px var(--ui-bg), 0 0 0 1px var(--ui-fg); }
.slot .jug { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; background: rgba(0,0,0,.3); border-radius: 2px; }
.slot .jug i { display: block; height: 100%; background: #4fc3ff; border-radius: 2px; }
.prompt { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: rgba(16,14,12,.85); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 0.9rem; z-index: 5; white-space: nowrap; }

/* Toasts */
.toasts { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 12; pointer-events: none; width: min(92vw, 34rem); }
.toast { background: rgba(16,14,12,.9); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 0.9rem; text-align: center; border-left: 4px solid #8aa; }
.toast.good { border-left-color: #5cc864; } .toast.warn { border-left-color: #f0a030; } .toast.quest { border-left-color: #f4c542; font-weight: 700; }

/* Touch */
#touch { position: absolute; inset: auto 0 0 0; height: 0; z-index: 6; }
.pad { position: absolute; left: 14px; bottom: 76px; width: 136px; height: 136px; border-radius: 50%; background: rgba(16,14,12,.35); border: 2px solid rgba(255,255,255,.55); touch-action: none; }
.pad .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.65); border: 2px solid rgba(16,14,12,.6); }
.abtns { position: absolute; right: 12px; bottom: 80px; display: flex; gap: 12px; align-items: flex-end; }
.tbtn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(16,14,12,.7); background: rgba(255,250,235,.85); color: #1a1612; font-weight: 800; font-size: 1.3rem; display: grid; place-items: center; line-height: 1; padding: 0; touch-action: none; }
.tbtn small { font-size: 0.6rem; font-weight: 700; }
.tb-a { width: 72px; height: 72px; background: rgba(244,197,66,.95); margin-bottom: 18px; }

/* Screens and panels */
.screen { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10,8,6,.55); padding: 12px; font-family: var(--ui-font); }
.screen.title { background: transparent; }
.panel { background: var(--ui-bg); color: var(--ui-fg); border: 3px solid var(--ui-border); border-radius: 14px; width: min(46rem, 100%); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow: auto; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.panel h2 { margin: 0 0 8px; font-size: 1.5rem; font-family: var(--ui-display); font-weight: 700; letter-spacing: .01em; }
.panel h3 { margin: 12px 0 6px; font-size: 1.12rem; font-family: var(--ui-display); }
.panel p { margin: 6px 0; line-height: 1.45; }
.muted { color: var(--ui-muted); }
.small { font-size: 0.85rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.btn { min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 9px; border: 2px solid var(--ui-fg); background: transparent; color: var(--ui-fg); font-weight: 700; }
.btn.primary { background: var(--ui-accent); color: var(--ui-accent-fg); border-color: var(--ui-accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 44px; padding: 4px 10px; font-size: 0.9rem; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 6px 12px; border-radius: 9px; border: 2px solid var(--ui-border); background: transparent; font-weight: 700; }
.tab.on { background: var(--ui-accent); color: var(--ui-accent-fg); border-color: var(--ui-accent); }
.grid { display: grid; grid-template-columns: repeat(8, 52px); gap: 6px; justify-content: center; }
.grid .slot { background: rgba(0,0,0,.1); border-color: rgba(0,0,0,.15); }
.grid .slot.pick { border-color: var(--ui-accent); background: rgba(255,255,255,.25); }
.detail { min-height: 4.2rem; margin-top: 10px; padding: 8px 10px; border: 2px dashed var(--ui-border); border-radius: 9px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 9px; background: rgba(0,0,0,.06); }
.li img { width: 36px; height: 36px; flex: none; }
.li .grow { flex: 1; min-width: 0; }
.li .price { font-weight: 700; font-variant-numeric: tabular-nums; }
.li.done { opacity: .75; }
.fact { padding: 8px 10px; border-left: 4px solid var(--ui-accent); background: rgba(0,0,0,.06); border-radius: 6px; margin: 8px 0; }
.fact .src { display: block; font-size: 0.8rem; color: var(--ui-muted); margin-top: 3px; word-break: break-word; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; margin-right: 4px; }
.hearts { letter-spacing: 1px; }
.kbd { display: inline-block; min-width: 1.6em; padding: 0 5px; border: 1.5px solid var(--ui-fg); border-radius: 4px; font-family: var(--font-sans); font-size: 0.85em; text-align: center; }
table.keys { border-collapse: collapse; width: 100%; }
table.keys td { padding: 4px 6px; border-bottom: 1px solid rgba(0,0,0,.12); vertical-align: middle; }

/* Dialogue */
.dialog { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(44rem, calc(100vw - 20px)); z-index: 22; display: flex; gap: 12px; align-items: flex-start; }
.dialog .portrait { width: 84px; height: 112px; flex: none; border-radius: 10px; border: 3px solid var(--ui-border); background: var(--ui-bg); }
.dialog .panel { width: auto; flex: 1; padding: 12px 14px; }
.dialog .who { font-weight: 700; font-size: 1.25rem; font-family: var(--ui-display); }
.dialog .role { font-size: 0.82rem; color: var(--ui-muted); }
.dialog .text { margin: 8px 0; font-size: 1.02rem; line-height: 1.45; }

/* Title */
.title-wrap { text-align: center; color: #fff; width: min(40rem, 100%); }
.title-wrap .brand { display: inline-block; padding: 12px 28px 6px; margin-bottom: 16px; background: radial-gradient(ellipse at center, rgba(16,12,8,.5), rgba(16,12,8,0) 70%); }
.title-wrap h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(2.4rem, 8vw, 4.4rem); margin: 0; color: #fff4dc; text-shadow: 0 2px 0 #5a3418, 0 4px 0 rgba(40,20,8,.6), 0 0 26px rgba(0,0,0,.55); line-height: 1.02; }
.title-wrap .sub { font-family: "Josefin Sans", var(--font-deco); color: #f6e7c4; font-size: clamp(1rem, 3.6vw, 1.35rem); letter-spacing: .18em; text-transform: uppercase; margin: 6px 0 8px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.title-menu { display: grid; gap: 10px; width: min(20rem, 100%); margin: 0 auto; background: var(--ui-bg); color: var(--ui-fg); padding: 14px; border-radius: 14px; border: 3px solid var(--ui-border); }
.title-menu .btn { width: 100%; }
.title-note { margin-top: 12px; font-size: 0.85rem; background: rgba(16,14,12,.78); color: #fff; padding: 6px 10px; border-radius: 8px; display: inline-block; }

/* Cards */
.card-era { text-transform: uppercase; letter-spacing: .1em; font-size: 0.8rem; color: var(--ui-muted); font-weight: 800; }

/* High contrast */
body.hc .panel-s, body.hc .panel, body.hc .hotbar { border-width: 3px; }
body.hc .toast { background: #000; }

@media (max-width: 699px) {
  #hud { padding: 6px; gap: 6px; flex-wrap: wrap; }
  .hud-l { min-width: 0; padding: 4px 8px; }
  .h-date { font-size: 0.8rem; } .h-row { font-size: 0.85rem; }
  .h-stats { min-width: 0; padding: 4px 8px; } .h-money { font-size: 0.95rem; }
  .h-energy .bar { min-width: 46px; }
  .h-quest { order: 5; flex-basis: 100%; max-width: none; font-size: 0.78rem; padding: 4px 8px; }
  .h-quest .q:nth-child(n+3) { display: none; }
  .hbtn { width: 44px; height: 44px; font-size: 1.1rem; }
  .h-btns { gap: 4px; }
  .hud-r { gap: 6px; }
  .hotbar { bottom: 6px; gap: 2px; padding: 3px; }
  .slot { width: 44px; height: 44px; }
  .slot img { width: 34px; height: 34px; }
  .prompt { bottom: 228px; font-size: 0.82rem; }
  .grid { grid-template-columns: repeat(6, 44px); }
  .grid .slot { width: 44px; height: 44px; }
  .toasts { top: 132px; }
  .dialog { bottom: 8px; }
  .dialog .portrait { width: 60px; height: 80px; }
  .panel { padding: 12px; }
}

/* ---------- visual pass: framed panels, inset slots, chunkier HUD ---------- */
.panel, .panel-s, .title-menu {
  background-color: var(--ui-bg);
  background-image: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.07), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.018) 0 2px, rgba(255,255,255,.018) 2px 4px);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 3px var(--ui-bg), inset 0 0 0 4px color-mix(in srgb, var(--ui-border) 70%, transparent), 0 10px 28px rgba(0,0,0,.45);
}
.panel { border-width: 3px; }
.panel h2 { padding-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--ui-border) 55%, transparent); }
.slot { background: color-mix(in srgb, var(--ui-fg) 9%, var(--ui-bg)); box-shadow: inset 0 2px 4px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.08); border-color: color-mix(in srgb, var(--ui-border) 60%, transparent); }
.slot.sel, .slot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ui-accent), inset 0 2px 4px rgba(0,0,0,.25); }
.slot img { filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
.hotbar { box-shadow: 0 0 0 1px rgba(0,0,0,.4), inset 0 0 0 3px var(--ui-bg), inset 0 0 0 4px color-mix(in srgb, var(--ui-border) 70%, transparent), 0 8px 22px rgba(0,0,0,.45); }
.btn { box-shadow: inset 0 -2px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.25); }
.btn.primary { box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), 0 2px 4px rgba(0,0,0,.3); }
.fact { border-left-width: 4px; }
.fact .src .site { font-variant: small-caps; letter-spacing: .03em; }
.toast { box-shadow: 0 4px 14px rgba(0,0,0,.35); border-radius: 10px; }
.prompt { box-shadow: 0 4px 14px rgba(0,0,0,.35); }

/* toasts sit in a lane above the hotbar, clear of the player; numbers line up */
.toasts { top: auto; bottom: 124px; flex-direction: column-reverse; }
#hud, .hotbar, .h-money, .h-energy, .slot .n, .price { font-variant-numeric: lining-nums tabular-nums; }
.h-date, .h-row, .h-quest { font-variant-numeric: lining-nums; }
.fact .src { font-size: 0.86rem; }
.small { font-size: 0.9rem; }
.pad { transition: opacity .3s; }
#touch:not(:focus-within) .pad:not(:active) { opacity: .6; }
@media (max-width: 699px) {
  .toasts { top: auto; bottom: 236px; }
  .h-date { white-space: nowrap; font-size: 0.78rem; }
  .h-row { white-space: nowrap; }
  .hud-l .h-row { gap: 4px; }
  .h-stats .h-money { white-space: nowrap; }
}
@media (max-width: 699px) {
  /* keep the date, money and buttons on one row in every era's typeface */
  .hud-l { padding: 3px 7px; }
  .h-date { font-size: 0.74rem; }
  .h-row { font-size: 0.78rem; }
  .h-stats { padding: 3px 7px; }
  .h-money { font-size: 0.86rem; }
  .h-energy { font-size: 0.72rem; gap: 4px; }
  .h-energy .bar { min-width: 30px; width: 30px; }
}

/* painted seed icons: the packet with the crop on its corner */
.ic-seed { position: relative; display: inline-block; width: 40px; height: 40px; flex: none; }
.ic-seed img { width: 100%; height: 100%; display: block; }
.ic-seed .ic-crop { position: absolute; width: 62%; height: 62%; right: -6%; bottom: -6%; }
.slot .ic-seed { width: 40px; height: 40px; pointer-events: none; }
.slot .ic-seed img { width: 100%; height: 100%; }
@media (max-width: 699px) { .slot .ic-seed { width: 34px; height: 34px; } }
.li .ic-seed { width: 36px; height: 36px; }
.li .ic-seed img { width: 100%; height: 100%; }
.row img.big, .row .ic-seed.big { width: 40px; height: 40px; flex: none; }

/* themed toasts in the era's panel colours */
.toast { background: var(--ui-bg); color: var(--ui-fg); border: 2px solid var(--ui-border); border-left-width: 6px; font-family: var(--ui-font); }
.toast.good { border-left-color: #4caf50; } .toast.quest { border-left-color: var(--ui-accent); } .toast.warn { border-left-color: #e0a030; }
.pad { opacity: .5; } .pad:active { opacity: 1; }
.h-date, .h-money, .h-row { font-family: var(--ui-font); font-variant-numeric: lining-nums tabular-nums; }
.h-date { font-weight: 700; }
@media (max-width: 699px) { .toasts { bottom: 272px; } }

</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="The farm and the valley" role="img"></canvas>
  <canvas id="nightfx" aria-hidden="true"></canvas>
  <div id="hud" hidden>
    <div class="hud-l panel-s">
      <div id="h-date" class="h-date"></div>
      <div class="h-row"><span id="h-time" class="h-time"></span><span id="h-wx" class="h-wx"></span></div>
    </div>
    <div id="h-quest" class="h-quest panel-s"></div>
    <div class="hud-r">
      <div class="panel-s h-stats">
        <div id="h-money" class="h-money"></div>
        <div class="h-energy" aria-label="Energy"><div class="bar"><i id="h-ebar"></i></div><span id="h-energy"></span></div>
      </div>
      <div class="h-btns">
        <button class="hbtn" data-act="open" data-arg="journal" title="Journal (L)" aria-label="Journal">📖</button>
        <button class="hbtn" data-act="open" data-arg="inventory" title="Pack and crafting (I)" aria-label="Pack and crafting">🎒</button>
        <button class="hbtn" data-act="open" data-arg="pause" title="Menu (Esc)" aria-label="Menu">☰</button>
      </div>
    </div>
  </div>
  <div id="prompt" class="prompt" hidden></div>
  <div id="hotbar" class="hotbar" hidden></div>
  <div id="touch" hidden>
    <div id="pad" class="pad" aria-label="Movement pad"><i class="knob"></i></div>
    <div class="abtns">
      <button id="btn-b" class="tbtn tb-b" aria-label="Talk or interact">B<small>Talk</small></button>
      <button id="btn-a" class="tbtn tb-a" aria-label="Use tool or item">A<small>Use</small></button>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="screen" class="screen" hidden></div>
  <canvas id="wipe" hidden></canvas>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</div>
<script>const FACTS = {"note":"Every history fact the game displays. bank = audited id in games/trivia/data/questions.json; corpus = checked against a research file. Verified by tools/check-facts.mjs.","facts":[{"id":"f-calfait","bank":"hs-0115","key":"Calfait Creek","text":"In December 1804 the Dunbar–Hunter party camped on Calfait Creek, today Gulpha Creek.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/"},{"id":"f-prudhomme","bank":"hs-0282","key":"Jean Pierre Emanuel Prudhomme","text":"In 1807 Jean Pierre Emanuel Prudhomme built the first real settlement at the springs and stayed two years.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-percival","bank":"hs-0283","key":"John Percival","text":"Trapper John Percival built cabins to rent to the health seekers who came to the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-quapaw-1818","bank":"hs-0008","key":"The Quapaw","text":"On Aug. 24, 1818, the Quapaw ceded the land around the hot springs to the United States.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-belding","bank":"hs-0007","key":"Massachusetts","text":"The Belding family came from Massachusetts in 1828 and built a small hotel for visitors.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-reservation","bank":"hs-0001","key":"April 20, 1832","text":"On April 20, 1832, President Andrew Jackson signed the act reserving the springs.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-first-reservation","bank":"hs-0473","key":"federal reservation","text":"Hot Springs began in 1832 as a federal reservation, which the Encyclopedia of Arkansas calls the nation's first.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770"},{"id":"f-yellowstone","bank":"hs-0002","key":"40 years","text":"The 1832 Hot Springs Reservation is 40 years older than Yellowstone National Park.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-new-madrid","bank":"hs-0010","key":"No. 467","text":"The Rector family's claim to the springs rested on New Madrid Certificate No. 467, one of the title fights over the reservation.","source":"Encyclopedia of Arkansas: Rector v. United States","sourceUrl":"https://encyclopediaofarkansas.net/entries/rector-v-united-states-14155/"},{"id":"f-garland-county","bank":"hs-0011","key":"1873","text":"Garland County was created in 1873, with Hot Springs as its seat.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-arlington-1875","bank":"hs-0058","key":"1875","text":"The first Arlington Hotel opened in 1875.","source":"Arlington Hotel: History","sourceUrl":"https://www.arlingtonhotel.com/history/"},{"id":"f-malvern-rail","bank":"hs-0016","key":"Malvern","text":"Diamond Jo Reynolds's railroad carried visitors to Hot Springs from Malvern.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157"},{"id":"f-white-stockings","bank":"hs-0182","key":"Chicago White Stockings","text":"In 1886 the Chicago White Stockings became the first major league club to hold spring training in Hot Springs.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"f-baden-baden","bank":"hs-0018","key":"Baden-Baden","text":"An 1877 railroad booklet promoted Hot Springs by comparing it to the German spa Baden-Baden.","source":"NPS: Getting to the American Spa","sourceUrl":"https://www.nps.gov/hosp/learn/kidsyouth/getting-to-hot-springs-national-park.htm"},{"id":"f-fire-1913","bank":"hs-0026","key":"Ironing that set a curtain alight","text":"The Great Fire of Sept. 5, 1913, started with ironing that set a curtain alight.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306"},{"id":"f-shingle-ban","bank":"hs-0030","key":"Wood-shingle roofs","text":"After the 1913 fire, Hot Springs outlawed wood-shingle roofs.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306"},{"id":"f-buckstaff","bank":"hs-0062","key":"The Buckstaff","text":"The Buckstaff has offered baths continuously since 1912.","source":"NPS: Buckstaff Bathhouse","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/buckstaff-bathhouse.htm"},{"id":"f-free-baths-1919","bank":"hs-0020","key":"87,040","text":"The Government Free Bathhouse gave about 87,040 free baths in 1919.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm"},{"id":"f-carpenter-dam","bank":"hs-0121","key":"Carpenter Dam|1931","text":"Carpenter Dam, completed in 1931, formed Lake Hamilton.","source":"Wikipedia: Lake Hamilton","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Hamilton_(Arkansas)"},{"id":"f-lamar","bank":"hs-0077","key":"The Lamar","text":"The Lamar's opening in 1923 completed Bathhouse Row.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-redistribution","bank":"hs-0038","key":"More than 32,000","text":"During World War II an Army redistribution center in Hot Springs processed more than 32,000 service members.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"f-polio","bank":"hs-0035","key":"Polio","text":"In World War II the Army-Navy Hospital was the nation's largest center for adults with polio.","source":"Encyclopedia of Arkansas: Army-Navy Hospital","sourceUrl":"https://encyclopediaofarkansas.net/entries/Arkansas-Career-Training-Institute-2236"},{"id":"f-mcmath","bank":"hs-0308","key":"Sid McMath","text":"In 1946 the WWII veteran Sid McMath led the GI Revolt against the town's political machine.","source":"Encyclopedia of Arkansas: GI Revolt","sourceUrl":"https://encyclopediaofarkansas.net/entries/GI-Revolt-4157"},{"id":"f-mclaughlin","bank":"hs-0311","key":"Leo P. McLaughlin","text":"The GI Revolt toppled the political machine of longtime Mayor Leo P. McLaughlin.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"f-blakely","bank":"hs-0126","key":"Blakely Mountain Dam","text":"Blakely Mountain Dam creates Lake Ouachita, which flooded farm communities in the 1950s.","source":"Wikipedia: Lake Ouachita","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita"},{"id":"f-breland","bank":"hs-0333","key":"Keller and Marian Breland","text":"Keller and Marian Breland, a husband-and-wife team, opened the IQ Zoo in Hot Springs.","source":"Encyclopedia of Arkansas: Keller Breland","sourceUrl":"https://encyclopediaofarkansas.net/entries/keller-bramwell-breland-2530/"},{"id":"f-skinner","bank":"hs-0325","key":"B. F. Skinner","text":"The IQ Zoo founders had trained under the psychologist B. F. Skinner.","source":"Encyclopedia of Arkansas: Keller Breland","sourceUrl":"https://encyclopediaofarkansas.net/entries/keller-bramwell-breland-2530/"},{"id":"f-fordyce-1962","bank":"hs-0089","key":"The Fordyce","text":"In 1962 the Fordyce became the first Bathhouse Row bathhouse to close.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-rail-1964","bank":"hs-0044","key":"1964","text":"Passenger rail service to Hot Springs ended in 1964.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157"},{"id":"f-desegregated","bank":"hs-0047","key":"1965","text":"The bathhouses were desegregated in 1965.","source":"Encyclopedia of Arkansas: Hot Springs (city)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/"},{"id":"f-1967","bank":"hs-0049","key":"1967","text":"Gov. Winthrop Rockefeller ended the casino revival in 1967.","source":"Wikipedia: Sid McMath","sourceUrl":"https://en.wikipedia.org/wiki/Sid_McMath"},{"id":"f-register-1974","bank":"hs-0100","key":"Nov. 13, 1974","text":"Bathhouse Row was listed on the National Register of Historic Places on Nov. 13, 1974.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-baths-1979","bank":"hs-0050","key":"About 96,000","text":"By 1979 the Row gave about 96,000 baths a year, as bathhouses closed one by one.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"f-visitor-center","bank":"hs-0096","key":"1989","text":"In 1989 the Fordyce reopened as the park's visitor center.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"f-superior","bank":"hs-0102","key":"The Superior","text":"The Superior, a 1916 bathhouse, now houses a brewery and distillery.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"f-quapaw-spa","bank":"hs-0103","key":"July 2008","text":"Quapaw Baths & Spa opened in the restored Quapaw Bathhouse in July 2008.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"f-majestic-fire","bank":"hs-0051","key":"Feb. 27, 2014","text":"The Majestic Hotel caught fire on Feb. 27, 2014.","source":"Encyclopedia of Arkansas: Hot Springs (city)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/"},{"id":"f-47-springs","bank":"hs-0148","key":"47","text":"USGS says 47 hot springs emerge from Hot Springs Mountain.","source":"USGS: Hot Springs National Park","sourceUrl":"https://www.usgs.gov/geology-and-ecology-of-national-parks/hot-springs-national-park"},{"id":"f-4400-years","bank":"hs-0145","key":"About 4,400 years","text":"Dating shows most of the thermal water is about 4,400 years old.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm"},{"id":"f-great-american-spa","bank":"hs-0512","key":"Great American Spa","text":"The bathing industry made Hot Springs known as the \"Great American Spa.\"","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-temp-1804","bank":"hs-0114","key":"148–150°F","text":"The 1804 Dunbar–Hunter expedition measured the springs at about 148–150°F on average.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/"},{"id":"f-desoto-legend","bank":"hs-0471","key":"There is no firm evidence he visited","text":"Legend says de Soto bathed here in 1541. Historians say there is no firm evidence he visited the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","legend":true},{"id":"f-bottling-1871","bank":"hs-0348","key":"Mountain Valley Spring Water","text":"Mountain Valley Spring Water, a Hot Springs bottled water, dates to 1871.","source":"Encyclopedia of Arkansas: Mountain Valley Spring Water","sourceUrl":"https://encyclopediaofarkansas.net/entries/mountain-valley-spring-water-2148/"},{"id":"f-cold-spring","bank":"hs-0394","key":"Cold","text":"Mountain Valley water comes out of its spring cold, not hot.","source":"NWA Democrat-Gazette (2021): High water mark","sourceUrl":"https://www.nwaonline.com/news/2021/aug/03/high-water-mark/"},{"id":"f-course","bank":"hs-0022","key":"21","text":"In 1920 a standard prescribed \"course\" was 21 baths.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm"},{"id":"f-free-bathhouse","bank":"hs-0019","key":"Dec. 16, 1878","text":"Congress passed the act establishing the Government Free Bathhouse on Dec. 16, 1878.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm"},{"id":"f-narrow-gauge","bank":"hs-0015","key":"3 feet (narrow gauge)","text":"The original Hot Springs Railroad from Malvern ran on 3 feet (narrow gauge) track.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157"},{"id":"f-mcclards","bank":"hs-0354","key":"A guest traded it for an unpaid bill","text":"The McClard family got its famous barbecue sauce recipe when a guest traded it for an unpaid bill.","source":"Encyclopedia of Arkansas: McClard's Bar-B-Q","sourceUrl":"https://encyclopediaofarkansas.net/entries/mcclards-bar-b-q-4230/"},{"id":"f-mcclards-goat","bank":"hs-0353","key":"Goat","text":"By 1928 the McClards were cooking goat with their barbecue sauce.","source":"Encyclopedia of Arkansas: McClard's Bar-B-Q","sourceUrl":"https://encyclopediaofarkansas.net/entries/mcclards-bar-b-q-4230/"},{"id":"f-kths","bank":"hs-0319","key":"Campbell Arnoux","text":"Campbell Arnoux was the founding director of KTHS radio, from 1924 to 1934.","source":"Encyclopedia of Arkansas: KTHS Radio Station","sourceUrl":"https://encyclopediaofarkansas.net/entries/kths-radio-station-6423/"},{"id":"f-200-islands","bank":"hs-0127","key":"About 200","text":"Lake Ouachita has about 200 islands.","source":"Wikipedia: Lake Ouachita","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita"},{"id":"f-140","bank":"hs-0364","key":"About 140°F","text":"Thermal water reaches the Superior Bathhouse Brewery at about 140°F.","source":"All About Beer: Superior Bathhouse Brewery","sourceUrl":"https://allaboutbeer.com/superior-bathhouse-brewery/"},{"id":"f-maurice","bank":"hs-0052","key":"About $31.6 million","text":"The Maurice Bathhouse restoration, which broke ground in August 2025, is about $31.6 million.","source":"NPS: Groundbreaking celebrated for Maurice Bathhouse rehabilitation","sourceUrl":"https://www.nps.gov/hosp/learn/news/maurice-gaoa-groundbreaking.htm"},{"id":"f-tubs","bank":"hs-0378","key":"Bathtubs","text":"Each year teams race bathtubs down Central Avenue.","source":"Visit Hot Springs: 2020 version of the World Championship Running of the Tubs (press release)","sourceUrl":"https://hotsprings.org/media-room/press-releases/2020-version-world-championship-running-tubs-batht/"},{"id":"f-tubs-2006","bank":"hs-0379","key":"2006","text":"The Running of the Tubs began in 2006, per its organizers.","source":"Visit Hot Springs: Running of the Tubs 2026 press release","sourceUrl":"https://hotsprings.org/media-room/press-releases/first-ever-running-of-the-tubs-website-provides-registration-fun-and-background-information-for-2026-world-championship-bathtub/"},{"id":"f-bridge-street","bank":"hs-0368","key":"Bridge Street","text":"The World's Shortest St. Patrick's Day Parade runs on Bridge Street.","source":"Visit Hot Springs: History of the shortest St. Patrick's parade","sourceUrl":"https://hotsprings.org/blog/history-of-the-worlds-shortest-st-patricks-day-parade/"},{"id":"f-razor-stone","bank":"hs-0143","key":"Razor stone","text":"Novaculite, the Ouachita whetstone rock, takes its name from the Latin for \"razor stone.\"","source":"Encyclopedia of Arkansas: Novaculite","sourceUrl":"https://encyclopediaofarkansas.net/entries/novaculite-2220/"},{"id":"f-whetstone-1818","bank":"hs-0012","key":"1818","text":"Novaculite whetstone mining began in the Hot Springs region as early as 1818.","source":"Arkansas Archeological Survey: Arkansas Novaculite (PDF)","sourceUrl":"https://archeology.uark.edu/wp-content/uploads/2026/04/ArkansasNovaculite-rev_acc.pdf"},{"id":"f-jefferson","bank":"hs-0003","key":"Thomas Jefferson","text":"President Thomas Jefferson sent William Dunbar and George Hunter to explore the Ouachita country and its hot springs.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/"},{"id":"f-four-springs","bank":"hs-0113","key":"Four","text":"Dunbar and Hunter counted four principal springs and two lesser ones in 1804.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/"},{"id":"f-novaculite-quarries","bank":"hs-0472","key":"Novaculite","text":"Native peoples quarried novaculite in the hills around Hot Springs for thousands of years.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770"},{"id":"f-capital-1862","bank":"hs-0009","key":"May 6 to July 14, 1862","text":"Hot Springs was the capital of Arkansas from May 6 to July 14, 1862.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-crystal","bank":"hs-0063","key":"The Crystal Bathhouse","text":"The Crystal Bathhouse, opened in 1904, was the first built exclusively for African Americans.","source":"NPS: African Americans and the Hot Springs Baths","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm"},{"id":"f-pythian","bank":"hs-0031","key":"The Knights of Pythias","text":"The Knights of Pythias opened the Pythian Bathhouse and Sanitarium in 1914.","source":"NPS: African Americans and the Hot Springs Baths","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm"},{"id":"f-army-navy","bank":"hs-0024","key":"Joint Army-Navy general hospital","text":"The Army and Navy Hospital that opened in 1887 was the nation's first joint Army-Navy general hospital.","source":"Encyclopedia of Arkansas: Army-Navy Hospital","sourceUrl":"https://encyclopediaofarkansas.net/entries/Arkansas-Career-Training-Institute-2236"},{"id":"f-gator-farm","bank":"hs-0298","key":"H. L. Campbell","text":"H. L. Campbell founded the alligator farm in 1902.","source":"Wikipedia: Arkansas Alligator Farm and Petting Zoo","sourceUrl":"https://en.wikipedia.org/wiki/Arkansas_Alligator_Farm_and_Petting_Zoo"},{"id":"f-7200","bank":"hs-0122","key":"About 7,200","text":"Lake Hamilton covers about 7,200 acres.","source":"Wikipedia: Lake Hamilton","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Hamilton_(Arkansas)"},{"id":"f-remmel","bank":"hs-0123","key":"Remmel Dam|1924","text":"Remmel Dam, built in 1924, forms Lake Catherine.","source":"Wikipedia: Lake Catherine","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Catherine_(Arkansas)"},{"id":"f-ccc","bank":"hs-0042","key":"The Civilian Conservation Corps","text":"The Civilian Conservation Corps built Lake Catherine State Park.","source":"Wikipedia: Lake Catherine State Park","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Catherine_State_Park"},{"id":"f-three-sisters","bank":"hs-0128","key":"Three Sisters Springs","text":"Lake Ouachita State Park preserves the historic Three Sisters Springs.","source":"Wikipedia: Lake Ouachita State Park","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita_State_Park"},{"id":"f-garvan-1956","bank":"hs-0324","key":"Verna Cook Garvan","text":"Verna Cook Garvan began developing Garvan Woodland Gardens in 1956.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"f-quartz","bank":"hs-0129","key":"1967","text":"Quartz crystal became Arkansas's state mineral in 1967.","source":"Encyclopedia of Arkansas: Official State Mineral","sourceUrl":"https://encyclopediaofarkansas.net/entries/official-state-mineral-3138/"},{"id":"f-hale","bank":"hs-0101","key":"The Hale","text":"The Hale is now the nine-suite Hotel Hale.","source":"NPS: Hale Bathhouse","sourceUrl":"https://www.nps.gov/places/hale-bathhouse.htm"},{"id":"f-ozark","bank":"hs-0104","key":"Hot Springs NP Cultural Center","text":"The Ozark Bathhouse now houses the Hot Springs NP Cultural Center.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"f-garvan-210","bank":"hs-0141","key":"210","text":"Garvan Woodland Gardens on Lake Hamilton covers 210 acres.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens"},{"id":"f-143","bank":"hs-0147","key":"About 143°F","text":"The thermal spring water averages about 143°F.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm"},{"id":"f-700000","bank":"hs-0146","key":"Over 700,000 gallons","text":"The National Park Service says the springs produce over 700,000 gallons a day.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm"},{"id":"f-tufa","bank":"hs-0156","key":"Tufa (travertine)","text":"The white-to-tan rock around the spring openings is called tufa (travertine).","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park"},{"id":"f-faults","bank":"hs-0151","key":"Alpha and beta","text":"Two faults, the alpha and beta, help carry the heated water back to the surface.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm"},{"id":"f-cold-ozone","bank":"hs-0157","key":"Happy Hollow and Whittington","text":"The park's two cold springs, Happy Hollow and Whittington, are treated with ozone filtration.","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park"},{"id":"f-maple-leaf-oak","bank":"hs-0170","key":"Maple-leaf oak","text":"The maple-leaf oak grows naturally at only four sites in the world, all in the Ouachitas.","source":"Wikipedia: Ouachita Mountains","sourceUrl":"https://en.wikipedia.org/wiki/Ouachita_Mountains"},{"id":"c-archaeology","corpus":{"file":"research/history-timeline.md","contains":["for over 10,000 years","92 known archaeological sites","Absentee Shawnee Tribe, the Caddo Nation, the Osage Nation and the Quapaw Tribe"]},"text":"People have lived here for over 10,000 years. The park has 92 known archaeological sites, including old novaculite quarries. The park consults with the Absentee Shawnee Tribe, the Caddo Nation, the Osage Nation and the Quapaw Tribe.","source":"NPS: Archeology (via research/history-timeline.md)","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/archeology.htm"},{"id":"f-enslaved-1860","corpus":{"file":"research/history-timeline.md","contains":["613 enslaved people out of 5,635 residents","many worked in hotels"]},"text":"In 1860, 613 of Hot Spring County's 5,635 residents were enslaved, and many worked in the resort's hotels.","source":"Encyclopedia of Arkansas: Hot Springs (city) (via research/history-timeline.md)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/"},{"id":"c-best-hours","corpus":{"file":"research/history-timeline.md","contains":["not during the 10 a.m.–noon hours doctors considered best","mostly African American until the 1980s"]},"text":"In the 1880s Black bathers could buy tickets at a few bathhouses, but not during the 10 a.m.–noon hours doctors considered best. Bath attendants were mostly African American until the 1980s.","source":"NPS: African Americans and the Hot Springs Baths (via research/history-timeline.md)","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm"}]};</script>

// Sell price of an item in a chapter (game prices).
const sellPrice = (id, ch) => {
  const it = ITEMS[id];
  if (!it || !it.sell) return 0;
  // Wild goods (fish, forage, raw materials) rise more slowly than farm goods.
  const r = CHAPTER_PRICE[ch] / CHAPTER_PRICE[it.base];
  return Math.max(1, Math.round(it.sell * (['fish', 'forage', 'material'].includes(it.kind) ? Math.sqrt(r) : r)));
};

    const it = inv[i]; if (!it) continue;
    const def = D.ITEMS[it.id];
    if (def.kind === 'tool') inv[i] = null;
    else if (def.kind === 'seed' && !D.CROPS[def.crop].ch.includes(ch)) { S.money += D.sellPrice(it.id, ch) * it.n; inv[i] = null; }
    else if (it.id === 'hut' || it.id === 'stand') inv[i] = null;
  }
  compactTools(S, ['hoe', 'jug', 'axe', 'pick', 'scythe', 'rod']);
  for (const [id, n] of C.kit) addItem(S, id, n);
  S.jug = D.JUG_CAP[C.tier] || 20;
  S.npcs = {};
  for (const [id, p] of Object.entries(D.PEOPLE)) if (p.ch === ch) {
    const at = placeOf(gm, p.sched[0][1]);
    S.npcs[id] = { pts: 0, talkDay: -1, giftDay: -1, x: at.x + 0.5, y: at.y + 0.9, path: null, place: p.sched[0][1], hidden: true, face: 'down' };
  }
  for (const q of D.QUESTS) if (q.ch === ch) S.quests[q.id] = { done: false };
  S.player.x = 4.5; S.player.y = 13.9; S.player.face = 'down';
  startDay(gm, true);
  emit(gm, 'chapter', { ch });
}

function compactTools(S, tools) {
  // Put tools in the first slots in a fixed order, shifting other items right.
  const others = S.inv.filter(Boolean);
  S.inv = new Array(INV_SIZE).fill(null);
  tools.forEach((t, i) => { S.inv[i] = { id: t, n: 1 }; });
  let j = tools.length;
  for (const it of others) { while (j < INV_SIZE && S.inv[j]) j++; if (j < INV_SIZE) S.inv[j++] = it; }
}

const emit = (gm, type, data = {}) => { gm.events.push({ type, ...data }); };
const toast = (gm, text, kind = 'info') => emit(gm, 'toast', { text, kind });
const sound = (gm, id) => emit(gm, 'sound', { id });

// ---------- calendar ----------
const season = (S) => D.SEASONS[Math.floor((S.day % D.YEAR_DAYS) / D.DAYS_PER_SEASON)];
const dayOfSeason = (S) => (S.day % D.DAYS_PER_SEASON) + 1;
const year = (S) => D.CHAPTERS[S.ch].year + Math.floor(S.day / D.YEAR_DAYS);
const clock = (S) => { const m = S.time % 1440; const h = Math.floor(m / 60), mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
const dateLabel = (S) => `${D.SEASON_NAME[season(S)]} ${dayOfSeason(S)}, ${year(S)}`;
const hearts = (pts) => Math.min(5, Math.floor(pts / 20));
const shopOpen = (S) => S.time >= 480 && S.time < (S.ch === 1 ? 1140 : 1020);
// 0 = full daylight … 1 = full night (game curve).
function darkness(S) {
  const t = S.time;
  if (t < 420) return 0.3 - (t - 360) / 60 * 0.3;
  if (t < 1080) return 0;
  if (t < 1200) return (t - 1080) / 120 * 0.85;
  return 0.85;
}

// ---------- inventory ----------
function count(S, id) {
  let n = 0;
  for (const it of S.inv) if (it && matches(it.id, id)) n += it.n;
  return n;
}
function matches(itemId, want) {
  if (want.startsWith('kind:')) return D.ITEMS[itemId] && D.ITEMS[itemId].kind === want.slice(5);
  return itemId === want;
}
function addItem(S, id, n = 1) {
  const def = D.ITEMS[id];
  const max = def && def.kind === 'tool' ? 1 : 99;
  for (const it of S.inv) if (it && it.id === id && it.n < max) { const k = Math.min(n, max - it.n); it.n += k; n -= k; if (!n) return 0; }
  for (let i = 0; i < S.inv.length && n > 0; i++) if (!S.inv[i]) { const k = Math.min(n, max); S.inv[i] = { id, n: k }; n -= k; }
  return n; // leftover that didn't fit
}
function removeItem(S, id, n = 1) {
  for (let i = S.inv.length - 1; i >= 0 && n > 0; i--) {
    const it = S.inv[i];
    if (it && matches(it.id, id)) { const k = Math.min(n, it.n); it.n -= k; n -= k; if (!it.n) S.inv[i] = null; }
  }
  return n === 0;
}
const selected = (S) => S.inv[S.sel] || null;
function swapSlots(S, a, b) { const t = S.inv[a]; S.inv[a] = S.inv[b]; S.inv[b] = t; }

// ---------- map queries ----------
const ground = (gm, x, y) => (x < 0 || y < 0 || x >= W || y >= H ? G.ROCK : gm.world.g[y * W + x]);
const BLOCK_OBJ = new Set(['tree', 'stump', 'rock', 'outcrop', 'crystal', 'fence', 'chest', 'hut', 'stand', 'bin', 'trough', 'pen', 'sign', 'fund', 'sprinkler', 'drip']);
function objAt(gm, x, y) { return gm.S.objs[key(x, y)] || gm.fixed[key(x, y)] || null; }
function blocked(gm, x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  if (groundBlocks(gm.world.g[y * W + x])) return true;
  if (gm.bmap[y * W + x] >= 0) return true;
  const o = objAt(gm, x, y);
  return !!(o && BLOCK_OBJ.has(o.t));
}
function placeOf(gm, name) {
  const S = gm.S;
  if (name === 'stand') { const k = Object.keys(S.objs).find((k) => S.objs[k].t === 'stand'); if (k) { const [x, y] = k.split(',').map(Number); return { x, y: y + 1 }; } }
  return gm.world.places[name] || gm.world.places.street;
}
const waterKind = (gm, x, y) => (gm.world.lake[y * W + x] ? 'lake' : 'creek');
const inField = (x, y) => x >= FIELD.x0 && x <= FIELD.x1 && y >= FIELD.y0 && y <= FIELD.y1;
const onFarm = (x, y) => x >= 1 && x <= 21 && y >= 7 && y <= 33;

function target(gm) {
  const p = gm.S.player;
  const tx = Math.floor(p.x), ty = Math.floor(p.y - 0.1);
  const [dx, dy] = DIR[p.face];
  return { x: tx + dx, y: ty + dy, px: tx, py: ty };
}

// ---------- the tick ----------
// input: { mx, my } movement in -1..1. Modal UI stops the clock (the caller just doesn't tick).
function tick(gm, input = {}) {
  const S = gm.S;
  if (S.finishedDay) return;
  S.tick++;
  if (S.tick >= D.TICKS_PER_MIN) {
    S.tick = 0; S.time++;
    if (S.time >= D.DAY_END) { sleep(gm, { passOut: true }); return; }
    visitCheck(gm);
  }
  movePlayer(gm, input);
  moveNpcs(gm);
  fishTick(gm);
  animalTick(gm);
}

function movePlayer(gm, input) {
  const S = gm.S, p = S.player;
  let mx = input.mx || 0, my = input.my || 0;
  if ((mx || my) && S.fishing) { S.fishing = null; toast(gm, 'You reel in your line.'); }
  if ((mx || my) && S.autoPath) S.autoPath = null;
  if (!mx && !my && S.autoPath && S.autoPath.length) {
    const n = S.autoPath[0];
    const dx = n.x + 0.5 - p.x, dy = n.y + 0.9 - p.y;
    if (Math.abs(dx) < 0.08 && Math.abs(dy) < 0.08) { S.autoPath.shift(); if (!S.autoPath.length) { S.autoPath = null; if (S.autoFace) { p.face = S.autoFace; S.autoFace = null; } } }
    else { mx = Math.abs(dx) > 0.04 ? Math.sign(dx) : 0; my = Math.abs(dy) > 0.04 ? Math.sign(dy) : 0; if (Math.abs(dx) > 0.04 && Math.abs(dy) > 0.04) my = 0; }
  }
  if (!mx && !my) { p.moving = false; return; }
  const len = Math.hypot(mx, my);
  let sp = SPEED * (S.energy <= 15 ? 0.7 : 1);
  if (S.autoPath) sp = Math.min(sp, Math.max(Math.abs((S.autoPath[0]?.x ?? 0) + 0.5 - p.x), Math.abs((S.autoPath[0]?.y ?? 0) + 0.9 - p.y), 0.02));
  const vx = mx / len * sp, vy = my / len * sp;
  if (Math.abs(mx) > Math.abs(my) + 0.01) p.face = mx > 0 ? 'right' : 'left';
  else if (my) p.face = my > 0 ? 'down' : 'up';
  else p.face = mx > 0 ? 'right' : 'left';
  const hw = 0.28, top = 0.2;
  const free = (x, y) => !blocked(gm, Math.floor(x - hw), Math.floor(y - top)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - top))
    && !blocked(gm, Math.floor(x - hw), Math.floor(y - 0.01)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - 0.01));
  if (free(p.x + vx, p.y)) p.x += vx;
  if (free(p.x, p.y + vy)) p.y += vy;
  p.x = Math.max(0.3, Math.min(W - 0.3, p.x)); p.y = Math.max(1.2, Math.min(H - 0.01, p.y));
  p.moving = true; p.walk = (p.walk + 1) % 10000;
}
function visitCheck(gm) {
  const S = gm.S, p = S.player;
  for (const [id, st] of Object.entries(S.quests)) {
    if (st.done) continue;
    const q = QUEST[id];
    if (q.type === 'visit') { const pl = placeOf(gm, q.place); if (Math.abs(pl.x + 0.5 - p.x) < 2.5 && Math.abs(pl.y + 0.5 - p.y) < 2.5) { S.cstats.visited[q.place] = true; checkQuests(gm); } }
  }
}
const QUEST = Object.fromEntries(D.QUESTS.map((q) => [q.id, q]));

function npcPlaceNow(S, id) {
  const p = D.PEOPLE[id];
  let place = p.sched[0][1];
  for (const [t, pl] of p.sched) if (S.time >= t) place = pl;
  if (S.weather === 'rain' && !['inn', 'hotel', 'club', 'store', 'bathhouse', 'radio', 'motel', 'brewery', 'market', 'zoo', 'court', 'drug', 'stage', 'depot', 'tradeCamp', 'drivein'].includes(place)) place = p.home;
  if (S.time >= 1320 && !(id === 'sal' && S.time < 1500)) place = p.home;
  return place;
}
// People who share a place stand side by side (a fixed offset per person in the chapter's cast).
function spotFor(gm, id, place) {
  const base = placeOf(gm, place);
  if (place === D.PEOPLE[id].home) return base;
  const cast = Object.keys(gm.S.npcs);
  const i = cast.indexOf(id);
  for (const dx of [[0, 1, -1][i % 3], 0]) { const x = base.x + dx; if (!blocked(gm, x, base.y)) return { x, y: base.y }; }
  return base;
}
function moveNpcs(gm) {
  const S = gm.S;
  const blk = (x, y) => blocked(gm, x, y);
  for (const [id, n] of Object.entries(S.npcs)) {
    const want = npcPlaceNow(S, id);
    if (want !== n.place || (!n.path && n.placeArrived !== want)) {
      n.place = want; n.placeArrived = null;
      const to = spotFor(gm, id, want);
      const sx = Math.floor(n.x), sy = Math.floor(n.y - 0.1);
      n.path = findPath(gm.nav, gm.navVersion, W, H, blk, sx, sy, to.x, to.y);
      n.path = n.path ? n.path.slice() : null;
      n.hidden = false;
      if (!n.path) { n.x = to.x + 0.5; n.y = to.y + 0.9; n.placeArrived = want; }
    }
    if (n.path && n.path.length) {
      const t = n.path[0];
      const dx = t.x + 0.5 - n.x, dy = t.y + 0.9 - n.y;
      const d = Math.hypot(dx, dy);
      if (d <= NPC_SPEED) { n.x = t.x + 0.5; n.y = t.y + 0.9; n.path.shift(); }
      else { n.x += dx / d * NPC_SPEED; n.y += dy / d * NPC_SPEED; n.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      n.moving = true;
      if (!n.path.length) { n.path = null; n.placeArrived = n.place; n.moving = false; n.face = 'down'; }
    } else n.moving = false;
    n.hidden = n.place === D.PEOPLE[id].home && !n.path && (S.time >= 1320 || S.time < 400);
  }
}

// ---------- energy ----------
function spend(gm, tool) {
  const S = gm.S;
  let c = D.ENERGY[tool] || 0;
  if (S.flags.whet && ['hoe', 'axe', 'pick', 'tiller'].includes(tool)) c = Math.max(1, c - 1);
  if (S.energy < c) { toast(gm, 'Too tired. Eat something, soak in the springs, or sleep.', 'warn'); sound(gm, 'nope'); return false; }
  S.energy -= c;
  return true;
}

// ---------- actions ----------
// use(): context first (person, object, building), then the selected item on the target tile.
function use(gm, at) {
  const S = gm.S;
  if (S.fishing) return reel(gm);
  const t = at || target(gm);
  const npc = npcAt(gm, t.x, t.y);
  if (npc) return { talk: npc };
  const r = interactAt(gm, t.x, t.y);
  if (r) return r;
  return useItemAt(gm, t.x, t.y);
}

function npcAt(gm, x, y) {
  for (const [id, n] of Object.entries(gm.S.npcs)) {
    if (n.hidden) continue;
    if (Math.abs(n.x - (x + 0.5)) < 0.75 && Math.abs(n.y - 0.5 - (y + 0.5)) < 0.8) return id;
  }
  return null;
}

function interactAt(gm, x, y) {
  const S = gm.S;
  const bi = x >= 0 && y >= 0 && x < W && y < H ? gm.bmap[y * W + x] : -1;
  if (bi >= 0) {
    const b = gm.world.buildings[bi];
    if (b.id === 'farmhouse') return { bed: true };
    if (b.place === 'store' || b.place === 'tradeCamp') {
      if (!shopOpen(S)) { toast(gm, `The ${D.SHOPS[S.ch].name.toLowerCase()} is closed. Open 8:00 to ${S.ch === 1 ? '19:00' : '17:00'}.`); return { done: true }; }
      return { shop: true };
    }
    if (b.place === 'mill' && S.ch === 2) return mill(gm);
    if (b.label) { toast(gm, `${titleCase(b.label)}.`); return { done: true }; }
    return null;
  }
  const o = objAt(gm, x, y);
  if (o) {
    if (o.t === 'bin') return { bin: true };
    if (o.t === 'trough') return trough(gm);
    if (o.t === 'sign') return { sign: o.k };
    if (o.t === 'fund') return { fund: true };
    if (o.t === 'chest') return { chest: true };
    if (o.t === 'hut') { toast(gm, S.ch === 1 ? 'Ezra rents this hut. He pays every morning.' : 'An old rental hut.'); return { done: true }; }
    if (o.t === 'stand') { toast(gm, 'Your roadside stand. Travelers pay into the cash box each morning.'); return { done: true }; }
  }
  const sp = gm.world.special[key(x, y)];
  if (sp === 'soak') return soak(gm);
  const sel = selected(S);
  if ((sp === 'hotspring' || sp === 'cold') && sel && sel.id === 'emptyjug') return fillJug(gm, sp === 'cold' ? 'coldwater' : 'hotwater');
  if (sp === 'hotspring' && (!sel || sel.id !== 'jug')) return { sign: 'springs' };
  return null;
}
const titleCase = (s) => s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());

function fillJug(gm, out) {
  const S = gm.S;
  removeItem(S, 'emptyjug', 1); addItem(S, out, 1); sound(gm, 'splash');
  toast(gm, out === 'hotwater' ? 'Filled a jug with steaming spring water.' : 'Filled a jug with cold spring water.');
  return { done: true };
}

function soak(gm) {
  const S = gm.S;
  if (S.soakDay === S.day) { toast(gm, 'You already soaked today.'); return { done: true }; }
  const fee = D.SOAK_FEE[S.ch];
  if (S.money < fee) { toast(gm, `A soak costs $${fee} (game price).`); return { done: true }; }
  S.money -= fee; S.soakDay = S.day;
  S.energy = Math.min(S.maxEnergy, S.energy + 30);
  sound(gm, 'splash');
  toast(gm, fee ? `A hot soak, $${fee}. +30 energy.` : 'A long hot soak. +30 energy.', 'good');
  return { done: true };
}

function mill(gm) {
  const S = gm.S;
  const n = count(S, 'corn');
  if (!n) { toast(gm, 'The miller grinds corn into meal. Bring corn.'); return { done: true }; }
  removeItem(S, 'corn', n); addItem(S, 'cornmeal', n);
  S.cstats.crafted.cornmeal = (S.cstats.crafted.cornmeal || 0) + n;
  sound(gm, 'craft'); toast(gm, `Ground ${n} corn into ${n} cornmeal.`, 'good');
  checkQuests(gm);
  return { done: true };
}

function trough(gm) {
  const S = gm.S;
  const sel = selected(S);
  let did = false;
  for (const [id, n] of Object.entries(S.penOut)) if (n) {
    addItem(S, id, n);
    S.cstats.collected[id] = (S.cstats.collected[id] || 0) + n;
    toast(gm, `Collected ${n} ${D.itemName(id).toLowerCase()}.`, 'good'); did = true;
  }
  S.penOut = {};
  if (S.animals.length) { S.animals.forEach((a) => { a.petDay = S.day; }); if (!did) toast(gm, 'You scratch the animals behind the ears. They look happy.'); did = true; }
  if (sel && (sel.id === 'hay' || sel.id === 'feed')) {
    const room = 20 - S.trough;
    const k = Math.min(room, sel.n);
    if (k > 0) { removeItem(S, sel.id, k); S.trough += k; toast(gm, `Put ${k} ${sel.id === 'hay' ? 'hay' : 'feed'} in the trough (${S.trough}/20).`); did = true; }
  }
  if (!did) toast(gm, S.ch === 1 ? 'An empty spot for a pen.' : `The trough has ${S.trough} feed. Animals: ${S.animals.length}/${D.PEN_MAX}. Buy animals at the store.`);
  sound(gm, 'pickup');
  checkQuests(gm);
  return { done: true };
}

function useItemAt(gm, x, y) {
  const S = gm.S;
  const k = key(x, y);
  const crop = S.crops[k];
  if (crop && !crop.dead && isRipe(crop)) return harvest(gm, x, y);
  if (S.forage[k]) return pickForage(gm, x, y);
  const sel = selected(S);
  if (!sel) { if (crop && crop.dead) return clearDead(gm, x, y); return { none: true }; }
  const def = D.ITEMS[sel.id];
  const g = ground(gm, x, y);
  const o = S.objs[k];
  switch (sel.id) {
    case 'hoe': return hoe(gm, x, y);
    case 'jug': {
      if (isWater(g) || g === G.POOL) { S.jug = D.JUG_CAP[D.CHAPTERS[S.ch].tier]; sound(gm, 'splash'); toast(gm, 'Jug filled.'); return { done: true }; }
      if (!S.soil[k]) return { none: true };
      if (S.jug <= 0) { toast(gm, 'The jug is empty. Fill it at the creek.', 'warn'); return { none: true }; }
      if (!spend(gm, 'jug')) return { none: true };
      S.jug--; S.soil[k] = 2; sound(gm, 'water');
      return { done: true, fx: 'water' };
    }
    case 'axe': return chop(gm, x, y);
    case 'pick': return mine(gm, x, y);
    case 'scythe': {
      if (crop && crop.dead) return clearDead(gm, x, y);
      if (o && o.t === 'tuft') { if (!spend(gm, 'scythe')) return { none: true }; delete S.objs[k]; addItem(S, 'hay', 1 + (chance(S, 0.5) ? 1 : 0)); sound(gm, 'swish'); gm.navVersion++; return { done: true }; }
      return { none: true };
    }
    case 'rod': return cast(gm, x, y);
  }
  if (def.kind === 'seed') return plant(gm, x, y, def.crop);
  if (def.kind === 'placeable') return place(gm, x, y, sel.id);
  if (crop && crop.dead) return clearDead(gm, x, y);
  if (def.energy) return { eat: sel.id };
  return { none: true };
}

function hoe(gm, x, y) {
  const S = gm.S;
  const tiles = S.ch >= 5 ? lineTiles(S, x, y, 3) : [[x, y]];
  const ok = tiles.filter(([tx, ty]) => canTill(gm, tx, ty));
  if (!ok.length) {
    const o = S.objs[key(x, y)];
    if (o && (o.t === 'tuft' || o.t === 'rock')) toast(gm, o.t === 'tuft' ? 'Clear the grass with the scythe first.' : 'Break the rock with the pick first.');
    else if (!inField(x, y) && ground(gm, x, y) === G.GRASS) toast(gm, 'Till inside your field (south of the cabin).');
    return { none: true };
  }
  if (!spend(gm, S.ch >= 5 ? 'tiller' : 'hoe')) return { none: true };
  for (const [tx, ty] of ok) S.soil[key(tx, ty)] = S.weather === 'rain' || S.weather === 'snow' ? 2 : 1;
  sound(gm, 'till');
  return { done: true, fx: 'dirt' };
}
function lineTiles(S, x, y) {
  const [dx, dy] = DIR[S.player.face];
  return [0, 1, 2].map((i) => [x + dx * i, y + dy * i]);
}
function canTill(gm, x, y) {
  const S = gm.S;
  if (!inField(x, y)) return false;
  if (ground(gm, x, y) !== G.GRASS) return false;
  if (S.soil[key(x, y)] || S.crops[key(x, y)] || S.objs[key(x, y)] || gm.fixed[key(x, y)]) return false;
  return true;
}

function plant(gm, x, y, cropId) {
  const S = gm.S, k = key(x, y);
  if (!S.soil[k]) { toast(gm, 'Seeds go in tilled soil. Use the hoe first.'); return { none: true }; }
  if (S.crops[k]) return { none: true };
  const c = D.CROPS[cropId];
  if (!c.seasons.includes(season(S))) { toast(gm, `${c.name} won't grow in ${D.SEASON_NAME[season(S)]}. It grows in ${c.seasons.map((s) => D.SEASON_NAME[s]).join(' and ')}.`, 'warn'); return { none: true }; }
  removeItem(S, 'seed:' + cropId, 1);
  S.crops[k] = { id: cropId, age: 0, h: 0 };
  S.cstats.planted++;
  sound(gm, 'plant');
  checkQuests(gm);
  return { done: true };
}
const isRipe = (c) => !c.dead && c.age >= D.CROPS[c.id].days;
function cropStage(c) {
  if (c.dead) return -1;
  const d = D.CROPS[c.id].days;
  if (c.age >= d) return 4;
  return Math.min(3, Math.floor(c.age / d * 4));
}
function harvest(gm, x, y) {
  const S = gm.S, k = key(x, y), c = S.crops[k], def = D.CROPS[c.id];
  let n = 1 + (rnd(S) < 0.1 ? 1 : 0);
  addItem(S, c.id, n);
  S.stats.harvested += n;
  if (def.regrow) { c.age = def.days - def.regrow; c.h++; }
  else { delete S.crops[k]; S.soil[k] = 1; }
  sound(gm, 'pickup');
  emit(gm, 'pop', { x, y, item: c.id, n });
  checkQuests(gm);
  return { done: true };
}
function clearDead(gm, x, y) { delete gm.S.crops[key(x, y)]; sound(gm, 'swish'); return { done: true }; }
function pickForage(gm, x, y) {
  const S = gm.S, k = key(x, y), id = S.forage[k];

  emit(gm, 'pop', { x, y, item: id, n: 1 });

}
function chop(gm, x, y) {
  const S = gm.S, k = key(x, y), o = S.objs[k];

    else { delete S.objs[k]; addItem(S, 'wood', 2); emit(gm, 'pop', { x, y, item: 'wood', n: 2 }); gm.navVersion++; }

}
function mine(gm, x, y) {
  const S = gm.S, k = key(x, y), o = S.objs[k];
  if (!o) return { none: true };
  if (o.placed) return pickUp(gm, x, y);

  }
  return { done: true, fx: 'spark' };
}
function pickUp(gm, x, y) {
  const S = gm.S, k = key(x, y), o = S.objs[k];
  if (o.t === 'hut' || o.t === 'stand') { toast(gm, 'That stays where it is.'); return { none: true }; }
  if (o.t === 'chest' && S.chest.some(Boolean)) { toast(gm, 'Empty the chest first.'); return { none: true }; }

}
function place(gm, x, y, id) {
  const S = gm.S, k = key(x, y);

  const g = ground(gm, x, y);
  if (id === 'stand') { if (!(onFarm(x, y) || (y >= 12 && y <= 14 && x <= 22))) { toast(gm, 'Put the stand on your land, by the road.'); return { none: true }; } }

  if (g !== G.GRASS && g !== G.PATH && g !== G.DIRT) { toast(gm, 'Not on that ground.'); return { none: true }; }
  removeItem(S, id, 1);
  S.objs[k] = { t: id, placed: true };
  if (S.soil[k] && id !== 'sprinkler' && id !== 'drip') delete S.soil[k];
  S.cstats.placed[id] = (S.cstats.placed[id] || 0) + 1;

  if (id === 'hut') toast(gm, 'Ezra moves into the new hut. Rent: $8 a day (game price).', 'good');

}
function eat(gm, id) {

  S.energy = Math.min(S.maxEnergy, S.energy + def.energy);

  return true;
}

// ---------- fishing ----------
function cast(gm, x, y) {
  const S = gm.S, g = ground(gm, x, y);
  if (!isWater(g) || gm.world.special[key(x, y)]) { toast(gm, 'Cast into the creek or the lake.'); return { none: true }; }
  if (!spend(gm, 'rod')) return { none: true };
  const biteAt = ri(S, 60, 210);
  S.fishing = { phase: 'wait', t: 0, biteAt, win: S.assist ? 54 : 36, water: waterKind(gm, x, y), x, y, empty: rnd(S) < 0.35 };
  sound(gm, 'cast');
  return { done: true };
}
function fishTick(gm) {
  const S = gm.S, f = S.fishing;
  if (!f) return;
  f.t++;
  if (f.phase === 'wait' && f.t >= f.biteAt) {
    if (f.empty) { S.fishing = null; toast(gm, 'Nothing is biting. Cast again.'); return; }
    f.phase = 'bite'; sound(gm, 'bite'); emit(gm, 'bite');
  }
  else if (f.phase === 'bite' && f.t > f.biteAt + f.win) { S.fishing = null; toast(gm, 'It got away.'); sound(gm, 'nope'); }
}
function reel(gm) {
  const S = gm.S, f = S.fishing;
  if (!f) return { none: true };
  if (f.phase === 'wait') { S.fishing = null; toast(gm, 'Too early. Wait for the bobber to dip.'); return { done: true }; }
  const id = rollFish(S, f.water);
  S.fishing = null;
  addItem(S, id, 1);
  S.cstats.caught[id] = (S.cstats.caught[id] || 0) + 1; S.stats.caught++;
  sound(gm, 'catch'); toast(gm, `Caught a ${D.FISH[id].name.toLowerCase()}!`, 'good');
  emit(gm, 'pop', { x: f.x, y: f.y, item: id, n: 1 });
  checkQuests(gm);
  return { done: true, caught: id };
}
function fishTable(ch, water, sea) {
  return Object.entries(D.FISH).filter(([, f]) => f.ch.includes(ch) && f.w.includes(water) && f.seasons.includes(sea));
}
function rollFish(S, water) {
  const t = fishTable(S.ch, water, season(S));
  const tot = t.reduce((a, [, f]) => a + f.p, 0);
  let r = rnd(S) * tot;
  for (const [id, f] of t) { r -= f.p; if (r <= 0) return id; }
  return t[t.length - 1][0];
}

// ---------- animals ----------
function animalTick(gm) {
  const S = gm.S;
  if (!S.animals.length || S.tick % 6) return;
  for (const a of S.animals) {
    if (!a.tx || Math.hypot(a.tx - a.x, a.ty - a.y) < 0.1) {
      if (rnd(S) < 0.02) { a.tx = PEN.x0 + 0.5 + rnd(S) * (PEN.x1 - PEN.x0); a.ty = PEN.y0 + 0.7 + rnd(S) * (PEN.y1 - PEN.y0); }
      continue;
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    a.x += dx / d * 0.08; a.y += dy / d * 0.08; a.face = dx > 0 ? 'right' : 'left';
  }
}

// ---------- shop, bin, crafting ----------
function shopList(S) {
  const sea = season(S);
  const list = [];
  for (const [id, c] of Object.entries(D.CROPS)) if (c.ch.includes(S.ch) && c.seasons.includes(sea)) list.push({ id: 'seed:' + id, price: D.seedPrice(id, S.ch) });
  for (const [id, price] of D.SHOPS[S.ch].stock) {
    if (id === 'animal') { const a = D.CHAPTERS[S.ch].animal; if (a) list.push({ id: 'animal', name: D.ANIMALS[a].name, price }); }
    else if (id === 'brickhouse') { if (!S.houseStyle) list.push({ id: 'brickhouse', name: 'Brick farmhouse (+20 stone)', price }); }
    else list.push({ id, price });
  }
  return list;
}
function buy(gm, id, n = 1) {
  const S = gm.S;
  const e = shopList(S).find((x) => x.id === id);
  if (!e) return false;
  const cost = e.price * n;
  if (S.money < cost) { toast(gm, 'Not enough money.', 'warn'); sound(gm, 'nope'); return false; }
  if (id === 'animal') {
    const a = D.CHAPTERS[S.ch].animal;
    if (S.animals.length + n > D.PEN_MAX) { toast(gm, 'The pen holds four.', 'warn'); return false; }
    S.money -= cost;
    for (let i = 0; i < n; i++) S.animals.push({ kind: a, x: PEN.x0 + 1.5 + S.animals.length, y: PEN.y0 + 1.6, petDay: -1, born: S.day });
    toast(gm, `A ${D.ANIMALS[a].name.toLowerCase()} joins the farm. Keep feed in the trough.`, 'good'); sound(gm, 'coin');
    return true;
  }
  if (id === 'brickhouse') {
    if (count(S, 'stone') < 20) { toast(gm, 'You need 20 stone for the foundation.', 'warn'); return false; }
    S.money -= cost; removeItem(S, 'stone', 20); S.houseStyle = 'brick'; rebuildWorld(gm);
    S.flags.brick = true; toast(gm, 'Masons raise a brick farmhouse.', 'good'); sound(gm, 'coin');
    checkQuests(gm);
    return true;
  }
  const left = addItem(S, id, n);
  const got = n - left;
  if (!got) { toast(gm, 'Your pack is full.', 'warn'); return false; }
  S.money -= e.price * got; sound(gm, 'coin');
  return true;
}
function sell(gm, id, n = 1) {
  const S = gm.S, have = count(S, id), k = Math.min(n, have), p = D.sellPrice(id, S.ch);
  if (!k || !p) return false;
  removeItem(S, id, k);
  credit(gm, p * k); sound(gm, 'coin');
  S.cstats.shipped[id] = (S.cstats.shipped[id] || 0) + k;
  const kind = D.ITEMS[id].kind; S.cstats.shippedKind[kind] = (S.cstats.shippedKind[kind] || 0) + k;
  checkQuests(gm);
  return true;
}
function credit(gm, amt) { const S = gm.S; S.money += amt; S.chapterEarned += amt; S.stats.earned += amt; }
function toBin(gm, slot, n) {
  const S = gm.S, it = S.inv[slot];
  if (!it) return false;
  const def = D.ITEMS[it.id];
  if (!D.sellPrice(it.id, S.ch) || def.kind === 'tool') { toast(gm, 'That can\'t be shipped.'); return false; }
  const k = Math.min(n ?? it.n, it.n);
  const e = S.bin.find((b) => b.id === it.id);
  if (e) e.n += k; else S.bin.push({ id: it.id, n: k });
  it.n -= k; if (!it.n) S.inv[slot] = null;
  sound(gm, 'drop');
  return true;
}
function fromBin(gm, i) {
  const S = gm.S, e = S.bin[i];
  if (!e) return false;
  const left = addItem(S, e.id, e.n);
  if (left) e.n = left; else S.bin.splice(i, 1);
  return true;
}
function recipesFor(S) { return Object.entries(D.RECIPES).filter(([, r]) => r.ch.includes(S.ch)); }
function canCraft(S, id) {
  const r = D.RECIPES[id];
  if (!r || !r.ch.includes(S.ch) || r.at !== 'pack') return false;
  return Object.entries(r.in).every(([i, n]) => count(S, i) >= n);
}
function craft(gm, id) {
  const S = gm.S;
  if (!canCraft(S, id)) { toast(gm, 'Missing ingredients.', 'warn'); return false; }
  const r = D.RECIPES[id];
  for (const [i, n] of Object.entries(r.in)) removeItem(S, i, n);
  addItem(S, r.out[0], r.out[1]);
  S.cstats.crafted[r.out[0]] = (S.cstats.crafted[r.out[0]] || 0) + r.out[1];
  if (id === 'whetstone' && !S.flags.whet) { S.flags.whet = true; toast(gm, 'Your tools take a razor edge: the hoe, axe and pick cost 1 less energy.', 'good'); }
  sound(gm, 'craft');
  checkQuests(gm);
  return true;
}
function donate(gm, amt) {
  const S = gm.S;
  if (S.money < amt) { toast(gm, 'Not enough money.', 'warn'); return false; }
  S.money -= amt; S.cstats.donated += amt;
  toast(gm, `Donated $${amt} to the restoration fund.`, 'good'); sound(gm, 'coin');
  checkQuests(gm);
  return true;
}

// ---------- people ----------
function talk(gm, id) {
  const S = gm.S, n = S.npcs[id], p = D.PEOPLE[id];
  if (!n) return null;
  const out = { npc: id, name: p.name, role: p.role, lines: [], facts: [] };
  // Face the player.
  const pl = S.player;
  n.face = Math.abs(pl.x - n.x) > Math.abs(pl.y - n.y) ? (pl.x > n.x ? 'right' : 'left') : (pl.y > n.y ? 'down' : 'up');
  // Quest hand-in first; reminders follow the person's own line.
  const reminders = [];
  for (const q of D.QUESTS) {
    if (q.ch !== S.ch || q.giver !== id || S.quests[q.id].done) continue;
    if (q.type === 'deliver' || q.type === 'variety') {
      if (q.at && S.time < q.at) { reminders.push(`Come find me after ${clockOf(q.at)}. ${q.desc}`); continue; }
      if (canDeliver(S, q)) {
        if (q.type === 'deliver') for (const [it, k] of Object.entries(q.items)) removeItem(S, it, k);
        else varietyTake(S, q.n, true);
        completeQuest(gm, q);
        out.lines.push(thanks(p, q));
        out.done = q.id;
      } else reminders.push(`${q.desc} ${progressText(gm, q)}`);
    }
  }
  if (n.talkDay !== S.day) { n.talkDay = S.day; addPts(gm, id, 3); }
  const h = hearts(n.pts);
  const sea = season(S);
  const cands = p.lines.filter((l) => l.h <= h && (!l.s || l.s === sea));
  if (cands.length) {
    const best = cands.filter((l) => l.h === Math.max(...cands.map((c) => c.h)));
    const pool = (S.day + hash(id) % 3) % 2 === 0 ? best : cands;
    const l = pool[(S.day + (hash(id, S.day) % 5)) % pool.length];
    out.lines.push(l.t);
    if (l.fact) out.facts.push(l.fact);
    if (l.ref) out.facts.push(l.ref);
    if (l.legend) out.legend = true;
  }
  out.reminders = reminders;
  out.hearts = hearts(n.pts);
  sound(gm, 'talk');
  return out;
}
const clockOf = (m) => `${Math.floor(m / 60) % 24}:${String(m % 60).padStart(2, '0')}`;
function thanks(p, q) { return `${['Perfect.', 'Wonderful.', 'Just what I needed.', 'Thank you kindly.'][q.id.length % 4]} Here, this is yours. (+$${q.reward.money})`; }
function canDeliver(S, q) {
  if (q.type === 'variety') return varietyTake(S, q.n, false);
  return Object.entries(q.items).every(([it, k]) => count(S, it) >= k);
}
function varietyTake(S, n, take) {
  const ids = [...new Set(S.inv.filter((it) => it && D.ITEMS[it.id].kind === 'crop').map((it) => it.id))];
  if (ids.length < n) return false;
  if (take) ids.slice(0, n).forEach((id) => removeItem(S, id, 1));
  return true;
}
function addPts(gm, id, k) {
  const n = gm.S.npcs[id]; if (!n) return;
  const before = hearts(n.pts);
  n.pts = Math.max(0, Math.min(100, n.pts + k));
  if (hearts(n.pts) > before) { toast(gm, `${D.PEOPLE[id].name}: ${'♥'.repeat(hearts(n.pts))}`, 'good'); emit(gm, 'heart', { npc: id }); }
  checkQuests(gm);
}
function giftReaction(id, item) {
  const g = D.PEOPLE[id].gifts;
  const hit = (list) => list.some((w) => matches(item, w));
  if (hit(g.love)) return 'love';
  if (hit(g.dislike)) return 'dislike';
  if (hit(g.like)) return 'like';
  return 'neutral';
}
function give(gm, id, itemId) {
  const S = gm.S, n = S.npcs[id];
  if (!n || !itemId || !count(S, itemId)) return null;
  if (D.ITEMS[itemId].kind === 'tool') return null;
  if (n.giftDay === S.day) { toast(gm, `You already gave ${D.PEOPLE[id].name.split(' ')[0]} a gift today.`); return { already: true }; }
  const r = giftReaction(id, itemId);
  removeItem(S, itemId, 1);
  n.giftDay = S.day;
  addPts(gm, id, { love: 12, like: 6, neutral: 2, dislike: -4 }[r]);
  sound(gm, r === 'dislike' ? 'nope' : 'gift');
  const first = D.PEOPLE[id].name.split(' ')[0];
  const text = { love: `${first} lights up. "I love this!"`, like: `${first} smiles. "Thank you."`, neutral: `${first} nods. "That's kind of you."`, dislike: `${first} frowns. "Oh. Well."` }[r];
  return { reaction: r, text };
}

// ---------- quests ----------
function questProgress(gm, q) {
  const S = gm.S, cs = S.cstats;
  switch (q.type) {
    case 'plant': return [cs.planted, q.n];
    case 'ship': return [cs.shippedKind[q.kind] || 0, q.n];
    case 'craft': return [cs.crafted[q.item] || 0, q.n];
    case 'place': return [cs.placed[q.item] || 0, q.n];
    case 'collect': return [cs.collected[q.item] || 0, q.n];
    case 'catch': return [cs.caught[q.item] || 0, q.n];
    case 'species': return [Object.keys(cs.caught).length, q.n];
    case 'earn': return [S.chapterEarned, q.n];
    case 'donate': return [cs.donated, q.n];
    case 'visit': return [cs.visited[q.place] ? 1 : 0, 1];
    case 'buyhouse': return [S.houseStyle === 'brick' ? 1 : 0, 1];
    case 'hearts': {
      if (q.npc === '*') { const c = Object.values(S.npcs).filter((n) => hearts(n.pts) >= q.n).length; return [c, q.count]; }
      return [hearts((S.npcs[q.npc] || { pts: 0 }).pts), q.n];
    }
    case 'deliver': { const e = Object.entries(q.items); return [e.reduce((a, [it, k]) => a + Math.min(k, count(S, it)), 0), e.reduce((a, [, k]) => a + k, 0)]; }
    case 'variety': { const ids = new Set(S.inv.filter((it) => it && D.ITEMS[it.id].kind === 'crop').map((it) => it.id)); return [Math.min(q.n, ids.size), q.n]; }
  }
  return [0, 1];
}
function progressText(gm, q) { const [a, b] = questProgress(gm, q); return `(${Math.min(a, b).toLocaleString('en-US')}/${b.toLocaleString('en-US')})`; }
function checkQuests(gm) {
  const S = gm.S;
  for (const q of D.QUESTS) {
    if (q.ch !== S.ch || !S.quests[q.id] || S.quests[q.id].done) continue;
    if (q.type === 'deliver' || q.type === 'variety') continue;
    const [a, b] = questProgress(gm, q);
    if (a >= b) completeQuest(gm, q);
  }
}
function completeQuest(gm, q) {
  const S = gm.S;
  S.quests[q.id].done = true; S.quests[q.id].day = S.day;
  if (q.reward.money) credit(gm, q.reward.money);
  if (q.reward.pts && q.giver) { const n = S.npcs[q.giver]; if (n) n.pts = Math.min(100, n.pts + q.reward.pts); }
  toast(gm, `${q.goal ? 'Goal' : 'Quest'} complete: ${q.title}${q.reward.money ? ` (+$${q.reward.money})` : ''}`, 'quest');
  sound(gm, 'quest');
  if (q.facts && q.facts.length) emit(gm, 'card', { title: q.title, facts: q.facts });
  if (goalsDone(S)) emit(gm, 'goals', { ch: S.ch });
}
const goalsFor = (ch) => D.QUESTS.filter((q) => q.ch === ch && q.goal);
const goalsDone = (S) => goalsFor(S.ch).every((q) => S.quests[q.id] && S.quests[q.id].done);

// ---------- days ----------
function sleep(gm, opts = {}) {
  const S = gm.S;
  const sum = { date: dateLabel(S), shipped: [], total: 0, rent: 0, wilted: 0, passOut: !!opts.passOut, lost: 0 };
  // Shipping.
  for (const e of S.bin) {
    const p = D.sellPrice(e.id, S.ch);
    sum.shipped.push({ id: e.id, n: e.n, each: p, total: p * e.n });
    sum.total += p * e.n;
    S.cstats.shipped[e.id] = (S.cstats.shipped[e.id] || 0) + e.n;
    const kind = D.ITEMS[e.id].kind; S.cstats.shippedKind[kind] = (S.cstats.shippedKind[kind] || 0) + e.n;
  }
  S.bin = [];
  if (sum.total) credit(gm, sum.total);
  if (S.ch === 1 && Object.values(S.objs).some((o) => o.t === 'hut')) { sum.rent = 8; credit(gm, 8); }
  if (Object.values(S.objs).some((o) => o.t === 'stand')) { sum.rent += 40; credit(gm, 40); }
  if (opts.passOut) { sum.lost = Math.min(100, Math.floor(S.money * 0.1)); S.money -= sum.lost; }
  // Crops grow where watered.
  for (const [k, c] of Object.entries(S.crops)) {
    if (c.dead) continue;
    if (S.soil[k] === 2) c.age++;
  }
  // Soil dries; bare tilled soil may revert.
  const dr = stream(S.seed, 'soil', S.ch, S.day);
  for (const k of Object.keys(S.soil)) {
    if (S.crops[k]) S.soil[k] = 1;
    else if (rnd(dr) < 0.15) delete S.soil[k];
    else S.soil[k] = 1;
  }
  // Animals produce if fed.
  for (const a of S.animals) {
    if (S.trough > 0) {
      S.trough--;
      const prod = D.ANIMALS[a.kind].product;
      S.penOut[prod] = (S.penOut[prod] || 0) + (a.petDay >= S.day - 1 && chance(S, 0.25) ? 2 : 1);
    }
  }
  S.day++; S.totalDays++;
  const newSea = season(S);
  if (S.day % D.DAYS_PER_SEASON === 0) {
    for (const c of Object.values(S.crops)) if (!c.dead && !D.CROPS[c.id].seasons.includes(newSea)) { c.dead = true; sum.wilted++; }
  }
  S.summary = sum;
  S.passOut = !!opts.passOut;

  ell(ctx, cx - u * 0.275, by - u * 0.44 - sw, u * 0.055, u * 0.055, skin); ell(ctx, cx + u * 0.275, by - u * 0.44 + sw, u * 0.055, u * 0.055, skin);

  else { ctx.beginPath(); ctx.arc(cx, hy - u * 0.02, u * 0.22, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); }
