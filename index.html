<script>const FACTS = {"note":"Every history fact the game displays. bank = audited id in games/trivia/data/questions.json; corpus = checked against a research file. Verified by tools/check-facts.mjs.","facts":[{"id":"f-calfait","bank":"hs-0115","key":"Calfait Creek","text":"In December 1804 the Dunbar–Hunter party camped on Calfait Creek, today Gulpha Creek.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/"},{"id":"f-prudhomme","bank":"hs-0282","key":"Jean Pierre Emanuel Prudhomme","text":"In 1807 Jean Pierre Emanuel Prudhomme built the first real settlement at the springs and stayed two years.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-percival","bank":"hs-0283","key":"John Percival","text":"Trapper John Percival built cabins to rent to the health seekers who came to the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-quapaw-1818","bank":"hs-0008","key":"The Quapaw","text":"On Aug. 24, 1818, the Quapaw ceded the land around the hot springs to the United States.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-belding","bank":"hs-0007","key":"Massachusetts","text":"The Belding family came from Massachusetts in 1828 and built a small hotel for visitors.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-reservation","bank":"hs-0001","key":"April 20, 1832","text":"On April 20, 1832, President Andrew Jackson signed the act reserving the springs.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-first-reservation","bank":"hs-0473","key":"federal reservation","text":"Hot Springs began in 1832 as a federal reservation, which the Encyclopedia of Arkansas calls the nation's first.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770"},{"id":"f-yellowstone","bank":"hs-0002","key":"40 years","text":"The 1832 Hot Springs Reservation is 40 years older than Yellowstone National Park.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-new-madrid","bank":"hs-0010","key":"No. 467","text":"The Rector family's claim to the springs rested on New Madrid Certificate No. 467, one of the title fights over the reservation.","source":"Encyclopedia of Arkansas: Rector v. United States","sourceUrl":"https://encyclopediaofarkansas.net/entries/rector-v-united-states-14155/"},{"id":"f-garland-county","bank":"hs-0011","key":"1873","text":"Garland County was created in 1873, with Hot Springs as its seat.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/"},{"id":"f-arlington-1875","bank":"hs-0058","key":"1875","text":"The first Arlington Hotel opened in 1875.","source":"Arlington Hotel: History","sourceUrl":"https://www.arlingtonhotel.com/history/"},{"id":"f-malvern-rail","bank":"hs-0016","key":"Malvern","text":"Diamond Jo Reynolds's railroad carried visitors to Hot Springs from Malvern.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157"},{"id":"f-white-stockings","bank":"hs-0182","key":"Chicago White Stockings","text":"In 1886 the Chicago White Stockings became the first major league club to hold spring training in Hot Springs.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"f-baden-baden","bank":"hs-0018","key":"Baden-Baden","text":"An 1877 railroad booklet promoted Hot Springs by comparing it to the German spa Baden-Baden.","source":"NPS: Getting to the American Spa","sourceUrl":"https://www.nps.gov/hosp/learn/kidsyouth/getting-to-hot-springs-national-park.htm"},{"id":"f-fire-1913","bank":"hs-0026","key":"Ironing that set a curtain alight","text":"The Great Fire of Sept. 5, 1913, started with ironing that set a curtain alight.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306"},{"id":"f-shingle-ban","bank":"hs-0030","key":"Wood-shingle roofs","text":"After the 1913 fire, Hot Springs outlawed wood-shingle roofs.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306"},{"id":"f-buckstaff","bank":"hs-0062","key":"The Buckstaff","text":"The Buckstaff has offered baths continuously since 1912.","source":"NPS: Buckstaff Bathhouse","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/buckstaff-bathhouse.htm"},{"id":"f-free-baths-1919","bank":"hs-0020","key":"87,040","text":"The Government Free Bathhouse gave about 87,040 free baths in 1919.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm"},{"id":"f-carpenter-dam","bank":"hs-0121","key":"Carpenter Dam|1931","text":"Carpenter Dam, completed in 1931, formed Lake Hamilton.","source":"Wikipedia: Lake Hamilton","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Hamilton_(Arkansas)"},{"id":"f-lamar","bank":"hs-0077","key":"The Lamar","text":"The Lamar's opening in 1923 completed Bathhouse Row.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"f-redistribution","bank":"hs-0038","key":"More than 32,000","text":"During World War II an Army redistribution center in Hot Springs processed more than 32,000 service members.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https:// // Sell price of an item in a chapter (game prices).
const sellPrice = (id, ch) => {
  const it = ITEMS[id];
  if (!it || !it.sell) return 0;
  // Wild goods (fish, forage, raw materials) rise more slowly than farm goods.
  const r = CHAPTER_PRICE[ch] / CHAPTER_PRICE[it.base];
  return Math.max(1, Math.round(it.sell * (['fish', 'forage', 'material'].includes(it.kind) ? Math.sqrt(r) : r)));
};

    const at = placeOf(gm, p.sched[0][1]);
    S.npcs[id] = { pts: 0, talkDay: -1, giftDay: -1, x: at.x + 0.5, y: at.y + 0.9, path: null, place: p.sched[0][1], hidden: true, face: 'down' };
  }
  for (const q of D.QUESTS) if (q.ch === ch) S.quests[q.id] = { done: false };
  S.player.x = 4.5; S.player.y = 13.9; S.player.face = 'down';
  startDay(gm, true);
  emit(gm, 'chapter', { ch });
}

function compactTools(S, tools) {
  // Put tools in the first slots in a fixed order, shifting other items right.
  const others = S.inv.filter(Boolean);
  S.inv = new Array(INV_SIZE).fill(null);
  tools.forEach((t, i) => { S.inv[i] = { id: t, n: 1 }; });
  let j = tools.length;
  for (const it of others) { while (j < INV_SIZE && S.inv[j]) j++; if (j < INV_SIZE) S.inv[j++] = it; }
}

const emit = (gm, type, data = {}) => { gm.events.push({ type, ...data }); };
const toast = (gm, text, kind = 'info') => emit(gm, 'toast', { text, kind });
const sound = (gm, id) => emit(gm, 'sound', { id });

// ---------- calendar ----------
const season = (S) => D.SEASONS[Math.floor((S.day % D.YEAR_DAYS) / D.DAYS_PER_SEASON)];
const dayOfSeason = (S) => (S.day % D.DAYS_PER_SEASON) + 1;
const year = (S) => D.CHAPTERS[S.ch].year + Math.floor(S.day / D.YEAR_DAYS);
const clock = (S) => { const m = S.time % 1440; const h = Math.floor(m / 60), mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
const dateLabel = (S) => `${D.SEASON_NAME[season(S)]} ${dayOfSeason(S)}, ${year(S)}`;
const hearts = (pts) => Math.min(5, Math.floor(pts / 20));
const shopOpen = (S) => S.time >= 480 && S.time < (S.ch === 1 ? 1140 : 1020);
// 0 = full daylight … 1 = full night (game curve).
function darkness(S) {
  const t = S.time;
  if (t < 420) return 0.3 - (t - 360) / 60 * 0.3;
  if (t < 1080) return 0;
  if (t < 1200) return (t - 1080) / 120 * 0.85;
  return 0.85;
}

// ---------- inventory ----------
function count(S, id) {
  let n = 0;
  for (const it of S.inv) if (it && matches(it.id, id)) n += it.n;
  return n;
}
function matches(itemId, want) {
  if (want.startsWith('kind:')) return D.ITEMS[itemId] && D.ITEMS[itemId].kind === want.slice(5);
  return itemId === want;
}
function addItem(S, id, n = 1) {
  const def = D.ITEMS[id];
  const max = def && def.kind === 'tool' ? 1 : 99;
  for (const it of S.inv) if (it && it.id === id && it.n < max) { const k = Math.min(n, max - it.n); it.n += k; n -= k; if (!n) return 0; }
  for (let i = 0; i < S.inv.length && n > 0; i++) if (!S.inv[i]) { const k = Math.min(n, max); S.inv[i] = { id, n: k }; n -= k; }
  return n; // leftover that didn't fit
}
function removeItem(S, id, n = 1) {
  for (let i = S.inv.length - 1; i >= 0 && n > 0; i--) {
    const it = S.inv[i];
    if (it && matches(it.id, id)) { const k = Math.min(n, it.n); it.n -= k; n -= k; if (!it.n) S.inv[i] = null; }
  }
  return n === 0;
}
const selected = (S) => S.inv[S.sel] || null;
function swapSlots(S, a, b) { const t = S.inv[a]; S.inv[a] = S.inv[b]; S.inv[b] = t; }

// ---------- map queries ----------
const ground = (gm, x, y) => (x < 0 || y < 0 || x >= W || y >= H ? G.ROCK : gm.world.g[y * W + x]);
const BLOCK_OBJ = new Set(['tree', 'stump', 'rock', 'outcrop', 'crystal', 'fence', 'chest', 'hut', 'stand', 'bin', 'trough', 'pen', 'sign', 'fund', 'sprinkler', 'drip']);
function objAt(gm, x, y) { return gm.S.objs[key(x, y)] || gm.fixed[key(x, y)] || null; }
function blocked(gm, x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  if (groundBlocks(gm.world.g[y * W + x])) return true;
  if (gm.bmap[y * W + x] >= 0) return true;
  const o = objAt(gm, x, y);
  return !!(o && BLOCK_OBJ.has(o.t));
}
function placeOf(gm, name) {
  const S = gm.S;
  if (name === 'stand') { const k = Object.keys(S.objs).find((k) => S.objs[k].t === 'stand'); if (k) { const [x, y] = k.split(',').map(Number); return { x, y: y + 1 }; } }
  return gm.world.places[name] || gm.world.places.street;
}
const waterKind = (gm, x, y) => (gm.world.lake[y * W + x] ? 'lake' : 'creek');
const inField = (x, y) => x >= FIELD.x0 && x <= FIELD.x1 && y >= FIELD.y0 && y <= FIELD.y1;
const onFarm = (x, y) => x >= 1 && x <= 21 && y >= 7 && y <= 33;

function target(gm) {
  const p = gm.S.player;
  const tx = Math.floor(p.x), ty = Math.floor(p.y - 0.1);
  const [dx, dy] = DIR[p.face];
  return { x: tx + dx, y: ty + dy, px: tx, py: ty };
}

// ---------- the tick ----------
// input: { mx, my } movement in -1..1. Modal UI stops the clock (the caller just doesn't tick).
function tick(gm, input = {}) {
  const S = gm.S;
  if (S.finishedDay) return;
  S.tick++;
  if (S.tick >= D.TICKS_PER_MIN) {
    S.tick = 0; S.time++;
    if (S.time >= D.DAY_END) { sleep(gm, { passOut: true }); return; }
    visitCheck(gm);
  }
  movePlayer(gm, input);
  moveNpcs(gm);
  fishTick(gm);
  animalTick(gm);
}

function movePlayer(gm, input) {
  const S = gm.S, p = S.player;
  let mx = input.mx || 0, my = input.my || 0;
  if ((mx || my) && S.fishing) { S.fishing = null; toast(gm, 'You reel in your line.'); }
  if ((mx || my) && S.autoPath) S.autoPath = null;
  if (!mx && !my && S.autoPath && S.autoPath.length) {
    const n = S.autoPath[0];
    const dx = n.x + 0.5 - p.x, dy = n.y + 0.9 - p.y;
    if (Math.abs(dx) < 0.08 && Math.abs(dy) < 0.08) { S.autoPath.shift(); if (!S.autoPath.length) { S.autoPath = null; if (S.autoFace) { p.face = S.autoFace; S.autoFace = null; } } }
    else { mx = Math.abs(dx) > 0.04 ? Math.sign(dx) : 0; my = Math.abs(dy) > 0.04 ? Math.sign(dy) : 0; if (Math.abs(dx) > 0.04 && Math.abs(dy) > 0.04) my = 0; }
  }
  if (!mx && !my) { p.moving = false; return; }
  const len = Math.hypot(mx, my);
  let sp = SPEED * (S.energy <= 15 ? 0.7 : 1);
  if (S.autoPath) sp = Math.min(sp, Math.max(Math.abs((S.autoPath[0]?.x ?? 0) + 0.5 - p.x), Math.abs((S.autoPath[0]?.y ?? 0) + 0.9 - p.y), 0.02));
  const vx = mx / len * sp, vy = my / len * sp;
  if (Math.abs(mx) > Math.abs(my) + 0.01) p.face = mx > 0 ? 'right' : 'left';
  else if (my) p.face = my > 0 ? 'down' : 'up';
  else p.face = mx > 0 ? 'right' : 'left';
  const hw = 0.28, top = 0.2;
  const free = (x, y) => !blocked(gm, Math.floor(x - hw), Math.floor(y - top)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - top))
    && !blocked(gm, Math.floor(x - hw), Math.floor(y - 0.01)) && !blocked(gm, Math.floor(x + hw), Math.floor(y - 0.01));
  if (free(p.x + vx, p.y)) p.x += vx;
  if (free(p.x, p.y + vy)) p.y += vy;
  p.x = Math.max(0.3, Math.min(W - 0.3, p.x)); p.y = Math.max(1.2, Math.min(H - 0.01, p.y));
  p.moving = true; p.walk = (p.walk + 1) % 10000;
}
function visitCheck(gm) {
  const S = gm.S, p = S.player;
  for (const [id, st] of Object.entries(S.quests)) {
    if (st.done) continue;
    const q = QUEST[id];
    if (q.type === 'visit') { const pl = placeOf(gm, q.place); if (Math.abs(pl.x + 0.5 - p.x) < 2.5 && Math.abs(pl.y + 0.5 - p.y) < 2.5) { S.cstats.visited[q.place] = true; checkQuests(gm); } }
  }
}
const QUEST = Object.fromEntries(D.QUESTS.map((q) => [q.id, q]));

function npcPlaceNow(S, id) {
  const p = D.PEOPLE[id];
  let place = p.sched[0][1];
  for (const [t, pl] of p.sched) if (S.time >= t) place = pl;
  if (S.weather === 'rain' && !['inn', 'hotel', 'club', 'store', 'bathhouse', 'radio', 'motel', 'brewery', 'market', 'zoo', 'court', 'drug', 'stage', 'depot', 'tradeCamp', 'drivein'].includes(place)) place = p.home;
  if (S.time >= 1320 && !(id === 'sal' && S.time < 1500)) place = p.home;
  return place;
}
// People who share a place stand side by side (a fixed offset per person in the chapter's cast).
function spotFor(gm, id, place) {
  const base = placeOf(gm, place);
  if (place === D.PEOPLE[id].home) return base;
  const cast = Object.keys(gm.S.npcs);
  const i = cast.indexOf(id);
  for (const dx of [[0, 1, -1][i % 3], 0]) { const x = base.x + dx; if (!blocked(gm, x, base.y)) return { x, y: base.y }; }
  return base;
}
function moveNpcs(gm) {
  const S = gm.S;
  const blk = (x, y) => blocked(gm, x, y);
  for (const [id, n] of Object.entries(S.npcs)) {
    const want = npcPlaceNow(S, id);
    if (want !== n.place || (!n.path && n.placeArrived !== want)) {
      n.place = want; n.placeArrived = null;
      const to = spotFor(gm, id, want);
      const sx = Math.floor(n.x), sy = Math.floor(n.y - 0.1);
      n.path = findPath(gm.nav, gm.navVersion, W, H, blk, sx, sy, to.x, to.y);
      n.path = n.path ? n.path.slice() : null;
      n.hidden = false;
      if (!n.path) { n.x = to.x + 0.5; n.y = to.y + 0.9; n.placeArrived = want; }
    }
    if (n.path && n.path.length) {
      const t = n.path[0];
      const dx = t.x + 0.5 - n.x, dy = t.y + 0.9 - n.y;
      const d = Math.hypot(dx, dy);
      if (d <= NPC_SPEED) { n.x = t.x + 0.5; n.y = t.y + 0.9; n.path.shift(); }
      else { n.x += dx / d * NPC_SPEED; n.y += dy / d * NPC_SPEED; n.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      n.moving = true;
      if (!n.path.length) { n.path = null; n.placeArrived = n.place; n.moving = false; n.face = 'down'; }
    } else n.moving = false;
    n.hidden = n.place === D.PEOPLE[id].home && !n.path && (S.time >= 1320 || S.time < 400);
  }
}

// ---------- energy ----------
function spend(gm, tool) {
  const S = gm.S;
  let c = D.ENERGY[tool] || 0;
  if (S.flags.whet && ['hoe', 'axe', 'pick', 'tiller'].includes(tool)) c = Math.max(1, c - 1);
  if (S.energy < c) { toast(gm, 'Too tired. Eat something, soak in the springs, or sleep.', 'warn'); sound(gm, 'nope'); return false; }
  S.energy -= c;
  return true;
}

// ---------- actions ----------
// use(): context first (person, object, building), then the selected item on the target tile.
function use(gm, at) {
  const S = gm.S;
  if (S.fishing) return reel(gm);
  const t = at || target(gm);
  const npc = npcAt(gm, t.x, t.y);
  if (npc) return { talk: npc };
  const r = interactAt(gm, t.x, t.y);
  if (r) return r;
  return useItemAt(gm, t.x, t.y);
}

function npcAt(gm, x, y) {
  for (const [id, n] of Object.entries(gm.S.npcs)) {
    if (n.hidden) continue;
    if (Math.abs(n.x - (x + 0.5)) < 0.75 && Math.abs(n.y - 0.5 - (y + 0.5)) < 0.8) return id;
  }
  return null;
}

function interactAt(gm, x, y) {
  const S = gm.S;
  const bi = x >= 0 && y >= 0 && x < W && y < H ? gm.bmap[y * W + x] : -1;
  if (bi >= 0) {
    const b = gm.world.buildings[bi];
    if (b.id === 'farmhouse') return { bed: true };
    if (b.place === 'store' || b.place === 'tradeCamp') {
      if (!shopOpen(S)) { toast(gm, `The ${D.SHOPS[S.ch].name.toLowerCase()} is closed. Open 8:00 to ${S.ch === 1 ? '19:00' : '17:00'}.`); return { done: true }; }
      return { shop: true };
    }
    if (b.place === 'mill' && S.ch === 2) return mill(gm);
    if (b.label) { toast(gm, `${titleCase(b.label)}.`); return { done: true }; }
    return null;
  }
  const o = objAt(gm, x, y);
  if (o) {
    if (o.t === 'bin') return { bin: true };
    if (o.t === 'trough') return trough(gm);
    if (o.t === 'sign') return { sign: o.k };
    if (o.t === 'fund') return { fund: true };
    if (o.t === 'chest') return { chest: true };
    if (o.t === 'hut') { toast(gm, S.ch === 1 ? 'Ezra rents this hut. He pays every morning.' : 'An old rental hut.'); return { done: true }; }
    if (o.t === 'stand') { toast(gm, 'Your roadside stand. Travelers pay into the cash box each morning.'); return { done: true }; }
  }
  const sp = gm.world.special[key(x, y)];
  if (sp === 'soak') return soak(gm);
  const sel = selected(S);
  if ((sp === 'hotspring' || sp === 'cold') && sel && sel.id === 'emptyjug') return fillJug(gm, sp === 'cold' ? 'coldwater' : 'hotwater');
  if (sp === 'hotspring' && (!sel || sel.id !== 'jug')) return { sign: 'springs' };
  return null;
}
const titleCase = (s) => s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());

function fillJug(gm, out) {
  const S = gm.S;
  removeItem(S, 'emptyjug', 1); addItem(S, out, 1); sound(gm, 'splash');
  toast(gm, out === 'hotwater' ? 'Filled a jug with steaming spring water.' : 'Filled a jug with cold spring water.');
  return { done: true };
}

function soak(gm) {
  const S = gm.S;
  if (S.soakDay === S.day) { toast(gm, 'You already soaked today.'); return { done: true }; }
  const fee = D.SOAK_FEE[S.ch];
  if (S.money < fee) { toast(gm, `A soak costs $${fee} (game price).`); return { done: true }; }
  S.money -= fee; S.soakDay = S.day;
  S.energy = Math.min(S.maxEnergy, S.energy + 30);
  sound(gm, 'splash');
  toast(gm, fee ? `A hot soak, $${fee}. +30 energy.` : 'A long hot soak. +30 energy.', 'good');
  return { done: true };
}

function mill(gm) {
  const S = gm.S;
  const n = count(S, 'corn');
  if (!n) { toast(gm, 'The miller grinds corn into meal. Bring corn.'); return { done: true }; }
  removeItem(S, 'corn', n); addItem(S, 'cornmeal', n);
  S.cstats.crafted.cornmeal = (S.cstats.crafted.cornmeal || 0) + n;
  sound(gm, 'craft'); toast(gm, `Ground ${n} corn into ${n} cornmeal.`, 'good');
  checkQuests(gm);
  return { done: true };
}

function trough(gm) {
  const S = gm.S;
  const sel = selected(S);
  let did = false;
  for (const [id, n] of Object.entries(S.penOut)) if (n) {
    addItem(S, id, n);
    S.cstats.collected[id] = (S.cstats.collected[id] || 0) + n;
    toast(gm, `Collected ${n} ${D.itemName(id).toLowerCase()}.`, 'good'); did = true;
  }
  S.penOut = {};
  if (S.animals.length) { S.animals.forEach((a) => { a.petDay = S.day; }); if (!did) toast(gm, 'You scratch the animals behind the ears. They look happy.'); did = true; }
  if (sel && (sel.id === 'hay' || sel.id === 'feed')) {
    const room = 20 - S.trough;
    const k = Math.min(room, sel.n);
    if (k > 0) { removeItem(S, sel.id, k); S.trough += k; toast(gm, `Put ${k} ${sel.id === 'hay' ? 'hay' : 'feed'} in the trough (${S.trough}/20).`); did = true; }
  }
  if (!did) toast(gm, S.ch === 1 ? 'An empty spot for a pen.' : `The trough has ${S.trough} feed. Animals: ${S.animals.length}/${D.PEN_MAX}. Buy animals at the store.`);
  sound(gm, 'pickup');
  checkQuests(gm);
  return { done: true };
}

function useItemAt(gm, x, y) {
  const S = gm.S;
  const k = key(x, y);
  const crop = S.crops[k];
  if (crop && !crop.dead && isRipe(crop)) return harvest(gm, x, y);
  if (S.forage[k]) return pickForage(gm, x, y);
  const sel = selected(S);
  if (!sel) { if (crop && crop.dead) return clearDead(gm, x, y); return { none: true }; }
  const def = D.ITEMS[sel.id];
  const g = ground(gm, x, y);
  const o = S.objs[k];
  switch (sel.id) {
    case 'hoe': return hoe(gm, x, y);
    case 'jug': {
      if (isWater(g) || g === G.POOL) { S.jug = D.JUG_CAP[D.CHAPTERS[S.ch].tier]; sound(gm, 'splash'); toast(gm, 'Jug filled.'); return { done: true }; }
      if (!S.soil[k]) return { none: true };
      if (S.jug <= 0) { toast(gm, 'The jug is empty. Fill it at the creek.', 'warn'); return { none: true }; }
      if (!spend(gm, 'jug')) return { none: true };
      S.jug--; S.soil[k] = 2; sound(gm, 'water');
      return { done: true, fx: 'water' };
    }
    case 'axe': return chop(gm, x, y);
    case 'pick': return mine(gm, x, y);
    case 'scythe': {
      if (crop && crop.dead) return clearDead(gm, x, y);
      if (o && o.t === 'tuft') { if (!spend(gm, 'scythe')) return { none: true }; delete S.objs[k]; addItem(S, 'hay', 1 + (chance(S, 0.5) ? 1 : 0)); sound(gm, 'swish'); gm.navVersion++; return { done: true }; }
      return { none: true };
    }
    case 'rod': return cast(gm, x, y);
  }
  if (def.kind === 'seed') return plant(gm, x, y, def.crop);
  if (def.kind === 'placeable') return place(gm, x, y, sel.id);
  if (crop && crop.dead) return clearDead(gm, x, y);
  if (def.energy) return { eat: sel.id };
  return { none: true };
}

function hoe(gm, x, y) {
  const S = gm.S;
  const tiles = S.ch >= 5 ? lineTiles(S, x, y, 3) : [[x, y]];
  const ok = tiles.filter(([tx, ty]) => canTill(gm, tx, ty));
  if (!ok.length) {
    const o = S.objs[key(x, y)];
    if (o && (o.t === 'tuft' || o.t === 'rock')) toast(gm, o.t === 'tuft' ? 'Clear the grass with the scythe first.' : 'Break the rock with the pick first.');
    else if (!inField(x, y) && ground(gm, x, y) === G.GRASS) toast(gm, 'Till inside your field (south of the cabin).');
    return { none: true };
  }
  if (!spend(gm, S.ch >= 5 ? 'tiller' : 'hoe')) return { none: true };
  for (const [tx, ty] of ok) S.soil[key(tx, ty)] = S.weather === 'rain' || S.weather === 'snow' ? 2 : 1;
  sound(gm, 'till');
  return { done: true, fx: 'dirt' };
}
function lineTiles(S, x, y) {
  const [dx, dy] = DIR[S.player.face];
  return [0, 1, 2].map((i) => [x + dx * i, y + dy * i]);
}
function canTill(gm, x, y) {
  const S = gm.S;
  if (!inField(x, y)) return false;
  if (ground(gm, x, y) !== G.GRASS) return false;
  if (S.soil[key(x, y)] || S.crops[key(x, y)] || S.objs[key(x, y)] || gm.fixed[key(x, y)]) return false;
  return true;
}

function plant(gm, x, y, cropId) {
  const S = gm.S, k = key(x, y);
  if (!S.soil[k]) { toast(gm, 'Seeds go in tilled soil. Use the hoe first.'); return { none: true }; }
  if (S.crops[k]) return { none: true };
  const c = D.CROPS[cropId];
  if (!c.seasons.includes(season(S))) { toast(gm, `${c.name} won't grow in ${D.SEASON_NAME[season(S)]}. It grows in ${c.seasons.map((s) => D.SEASON_NAME[s]).join(' and ')}.`, 'warn'); return { none: true }; }
  removeItem(S, 'seed:' + cropId, 1);
  S.crops[k] = { id: cropId, age: 0, h: 0 };
  S.cstats.planted++;
  sound(gm, 'plant');
  checkQuests(gm);
  return { done: true };
}
const isRipe = (c) => !c.dead && c.age >= D.CROPS[c.id].days;
function cropStage(c) {
  if (c.dead) return -1;
  const d = D.CROPS[c.id].days;
  if (c.age >= d) return 4;
  return Math.min(3, Math.floor(c.age / d * 4));
}
function harvest(gm, x, y) {
  const S = gm.S, k = key(x, y), c = S.crops[k], def = D.CROPS[c.id];
  let n = 1 + (rnd(S) < 0.1 ? 1 : 0);
  addItem(S, c.id, n);
  S.stats.harvested += n;
  if (def.regrow) { c.age = def.days - def.regrow; c.h++; }
  else { delete S.crops[k]; S.soil[k] = 1; }
  sound(gm, 'pickup');
  emit(gm, 'pop', { x, y, item: c.id, n });
  checkQuests(gm);
  return { done: true };
}
function clearDead(gm, x, y) { delete gm.S.crops[key(x, y)]; sound(gm, 'swish'); return { done: true }; }
function pickForage(gm, x, y) {
  const S = gm.S, k = key(x, y), id = S.forage[k];
  delete S.forage[k]; addItem(S, id, 1); sound(gm, 'pickup');
  emit(gm, 'pop', { x, y, item: id, n: 1 });
  if (id === 'oakleaf' && !S.almanac.includes(D.LEAF_FACT)) emit(gm, 'card', { title: 'A rare leaf', facts: [D.LEAF_FACT] });
  return { done: true };
}
function chop(gm, x, y) {

    else { delete S.objs[k]; addItem(S, 'wood', 2); emit(gm, 'pop', { x, y, item: 'wood', n: 2 }); gm.navVersion++; }

}
function mine(gm, x, y) {

}
function pickUp(gm, x, y) {

}
function place(gm, x, y, id) {

  removeItem(S, id, 1);

function eat(gm, id) {

  return true;
}

// ---------- fishing ----------
function cast(gm, x, y) {
  const S = gm.S, g = ground(gm, x, y);
  if (!isWater(g) || gm.world.special[key(x, y)]) { toast(gm, 'Cast into the creek or the lake.'); return { none: true }; }
  if (!spend(gm, 'rod')) return { none: true };
  const biteAt = ri(S, 60, 210);
  S.fishing = { phase: 'wait', t: 0, biteAt, win: S.assist ? 54 : 36, water: waterKind(gm, x, y), x, y, empty: rnd(S) < 0.35 };
  sound(gm, 'cast');
  return { done: true };
}
function fishTick(gm) {
  const S = gm.S, f = S.fishing;
  if (!f) return;
  f.t++;
  if (f.phase === 'wait' && f.t >= f.biteAt) {
    if (f.empty) { S.fishing = null; toast(gm, 'Nothing is biting. Cast again.'); return; }
    f.phase = 'bite'; sound(gm, 'bite'); emit(gm, 'bite');
  }
  else if (f.phase === 'bite' && f.t > f.biteAt + f.win) { S.fishing = null; toast(gm, 'It got away.'); sound(gm, 'nope'); }
}
function reel(gm) {
  const S = gm.S, f = S.fishing;
  if (!f) return { none: true };
  if (f.phase === 'wait') { S.fishing = null; toast(gm, 'Too early. Wait for the bobber to dip.'); return { done: true }; }
  const id = rollFish(S, f.water);
  S.fishing = null;
  addItem(S, id, 1);
  S.cstats.caught[id] = (S.cstats.caught[id] || 0) + 1; S.stats.caught++;
  sound(gm, 'catch'); toast(gm, `Caught a ${D.FISH[id].name.toLowerCase()}!`, 'good');
  emit(gm, 'pop', { x: f.x, y: f.y, item: id, n: 1 });
  checkQuests(gm);
  return { done: true, caught: id };
}
function fishTable(ch, water, sea) {
  return Object.entries(D.FISH).filter(([, f]) => f.ch.includes(ch) && f.w.includes(water) && f.seasons.includes(sea));
}
function rollFish(S, water) {
  const t = fishTable(S.ch, water, season(S));
  const tot = t.reduce((a, [, f]) => a + f.p, 0);
  let r = rnd(S) * tot;
  for (const [id, f] of t) { r -= f.p; if (r <= 0) return id; }
  return t[t.length - 1][0];
}

// ---------- animals ----------
function animalTick(gm) {
  const S = gm.S;
  if (!S.animals.length || S.tick % 6) return;
  for (const a of S.animals) {
    if (!a.tx || Math.hypot(a.tx - a.x, a.ty - a.y) < 0.1) {
      if (rnd(S) < 0.02) { a.tx = PEN.x0 + 0.5 + rnd(S) * (PEN.x1 - PEN.x0); a.ty = PEN.y0 + 0.7 + rnd(S) * (PEN.y1 - PEN.y0); }
      continue;
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    a.x += dx / d * 0.08; a.y += dy / d * 0.08; a.face = dx > 0 ? 'right' : 'left';
  }
}

// ---------- shop, bin, crafting ----------
function shopList(S) {
  const sea = season(S);
  const list = [];
  for (const [id, c] of Object.entries(D.CROPS)) if (c.ch.includes(S.ch) && c.seasons.includes(sea)) list.push({ id: 'seed:' + id, price: D.seedPrice(id, S.ch) });
  for (const [id, price] of D.SHOPS[S.ch].stock) {
    if (id === 'animal') { const a = D.CHAPTERS[S.ch].animal; if (a) list.push({ id: 'animal', name: D.ANIMALS[a].name, price }); }
    else if (id === 'brickhouse') { if (!S.houseStyle) list.push({ id: 'brickhouse', name: 'Brick farmhouse (+20 stone)', price }); }
    else list.push({ id, price });
  }
  return list;
}
function buy(gm, id, n = 1) {
  const S = gm.S;
  const e = shopList(S).find((x) => x.id === id);
  if (!e) return false;
  const cost = e.price * n;
  if (S.money < cost) { toast(gm, 'Not enough money.', 'warn'); sound(gm, 'nope'); return false; }
  if (id === 'animal') {
    const a = D.CHAPTERS[S.ch].animal;
    if (S.animals.length + n > D.PEN_MAX) { toast(gm, 'The pen holds four.', 'warn'); return false; }
    S.money -= cost;
    for (let i = 0; i < n; i++) S.animals.push({ kind: a, x: PEN.x0 + 1.5 + S.animals.length, y: PEN.y0 + 1.6, petDay: -1, born: S.day });
    toast(gm, `A ${D.ANIMALS[a].name.toLowerCase()} joins the farm. Keep feed in the trough.`, 'good'); sound(gm, 'coin');
    return true;
  }
  if (id === 'brickhouse') {
    if (count(S, 'stone') < 20) { toast(gm, 'You need 20 stone for the foundation.', 'warn'); return false; }
    S.money -= cost; removeItem(S, 'stone', 20); S.houseStyle = 'brick'; rebuildWorld(gm);
    S.flags.brick = true; toast(gm, 'Masons raise a brick farmhouse.', 'good'); sound(gm, 'coin');
    checkQuests(gm);
    return true;
  }
  const left = addItem(S, id, n);
  const got = n - left;
  if (!got) { toast(gm, 'Your pack is full.', 'warn'); return false; }
  S.money -= e.price * got; sound(gm, 'coin');
  return true;
}
function sell(gm, id, n = 1) {
  const S = gm.S, have = count(S, id), k = Math.min(n, have), p = D.sellPrice(id, S.ch);
  if (!k || !p) return false;
  removeItem(S, id, k);
  credit(gm, p * k); sound(gm, 'coin');
  S.cstats.shipped[id] = (S.cstats.shipped[id] || 0) + k;
  const kind = D.ITEMS[id].kind; S.cstats.shippedKind[kind] = (S.cstats.shippedKind[kind] || 0) + k;
  checkQuests(gm);
  return true;
}
function credit(gm, amt) { const S = gm.S; S.money += amt; S.chapterEarned += amt; S.stats.earned += amt; }
function toBin(gm, slot, n) {
  const S = gm.S, it = S.inv[slot];
  if (!it) return false;
  const def = D.ITEMS[it.id];
  if (!D.sellPrice(it.id, S.ch) || def.kind === 'tool') { toast(gm, 'That can\'t be shipped.'); return false; }
  const k = Math.min(n ?? it.n, it.n);
  const e = S.bin.find((b) => b.id === it.id);
  if (e) e.n += k; else S.bin.push({ id: it.id, n: k });
  it.n -= k; if (!it.n) S.inv[slot] = null;
  sound(gm, 'drop');
  return true;
}
function fromBin(gm, i) {
  const S = gm.S, e = S.bin[i];
  if (!e) return false;
  const left = addItem(S, e.id, e.n);
  if (left) e.n = left; else S.bin.splice(i, 1);
  return true;
}
function recipesFor(S) { return Object.entries(D.RECIPES).filter(([, r]) => r.ch.includes(S.ch)); }
function canCraft(S, id) {
  const r = D.RECIPES[id];
  if (!r || !r.ch.includes(S.ch) || r.at !== 'pack') return false;
  return Object.entries(r.in).every(([i, n]) => count(S, i) >= n);
}
function craft(gm, id) {
  const S = gm.S;
  if (!canCraft(S, id)) { toast(gm, 'Missing ingredients.', 'warn'); return false; }
  const r = D.RECIPES[id];
  for (const [i, n] of Object.entries(r.in)) removeItem(S, i, n);
  addItem(S, r.out[0], r.out[1]);
  S.cstats.crafted[r.out[0]] = (S.cstats.crafted[r.out[0]] || 0) + r.out[1];
  if (id === 'whetstone' && !S.flags.whet) { S.flags.whet = true; toast(gm, 'Your tools take a razor edge: the hoe, axe and pick cost 1 less energy.', 'good'); }
  sound(gm, 'craft');
  checkQuests(gm);
  return true;
}
function donate(gm, amt) {
  const S = gm.S;
  if (S.money < amt) { toast(gm, 'Not enough money.', 'warn'); return false; }
  S.money -= amt; S.cstats.donated += amt;
  toast(gm, `Donated $${amt} to the restoration fund.`, 'good'); sound(gm, 'coin');
  checkQuests(gm);
  return true;

// ---------- people ----------
function talk(gm, id) {
  const S = gm.S, n = S.npcs[id], p = D.PEOPLE[id];
  if (!n) return null;
  const out = { npc: id, name: p.name, role: p.role, lines: [], facts: [] };
  // Face the player.
  const pl = S.player;
  n.face = Math.abs(pl.x - n.x) > Math.abs(pl.y - n.y) ? (pl.x > n.x ? 'right' : 'left') : (pl.y > n.y ? 'down' : 'up');
  // Quest hand-in first; reminders follow the person's own line.
  const reminders = [];
  for (const q of D.QUESTS) {
    if (q.ch !== S.ch || q.giver !== id || S.quests[q.id].done) continue;
    if (q.type === 'deliver' || q.type === 'variety') {
      if (q.at && S.time < q.at) { reminders.push(`Come find me after ${clockOf(q.at)}. ${q.desc}`); continue; }
      if (canDeliver(S, q)) {
        if (q.type === 'deliver') for (const [it, k] of Object.entries(q.items)) removeItem(S, it, k);
        else varietyTake(S, q.n, true);
        completeQuest(gm, q);
        out.lines.push(thanks(p, q));
        out.done = q.id;
      } else reminders.push(`${q.desc} ${progressText(gm, q)}`);
    }
  }
  if (n.talkDay !== S.day) { n.talkDay = S.day; addPts(gm, id, 3); }
  const h = hearts(n.pts);
  const sea = season(S);
  const cands = p.lines.filter((l) => l.h <= h && (!l.s || l.s === sea));
  if (cands.length) {
    const best = cands.filter((l) => l.h === Math.max(...cands.map((c) => c.h)));
    const pool = (S.day + hash(id) % 3) % 2 === 0 ? best : cands;
    const l = pool[(S.day + (hash(id, S.day) % 5)) % pool.length];
    out.lines.push(l.t);
    if (l.fact) out.facts.push(l.fact);
    if (l.ref) out.facts.push(l.ref);
    if (l.legend) out.legend = true;
  }
  out.reminders = reminders;
  out.hearts = hearts(n.pts);
  sound(gm, 'talk');
  return out;
}
const clockOf = (m) => `${Math.floor(m / 60) % 24}:${String(m % 60).padStart(2, '0')}`;
function thanks(p, q) { return `${['Perfect.', 'Wonderful.', 'Just what I needed.', 'Thank you kindly.'][q.id.length % 4]} Here, this is yours. (+$${q.reward.money})`; }
function canDeliver(S, q) {
  if (q.type === 'variety') return varietyTake(S, q.n, false);
  return Object.entries(q.items).every(([it, k]) => count(S, it) >= k);
}
function varietyTake(S, n, take) {
  const ids = [...new Set(S.inv.filter((it) => it && D.ITEMS[it.id].kind === 'crop').map((it) => it.id))];
  if (ids.length < n) return false;
  if (take) ids.slice(0, n).forEach((id) => removeItem(S, id, 1));
  return true;
}
function addPts(gm, id, k) {
  const n = gm.S.npcs[id]; if (!n) return;
  const before = hearts(n.pts);
  n.pts = Math.max(0, Math.min(100, n.pts + k));
  if (hearts(n.pts) > before) { toast(gm, `${D.PEOPLE[id].name}: ${'♥'.repeat(hearts(n.pts))}`, 'good'); emit(gm, 'heart', { npc: id }); }
  checkQuests(gm);
}
function giftReaction(id, item) {
  const g = D.PEOPLE[id].gifts;
  const hit = (list) => list.some((w) => matches(item, w));
  if (hit(g.love)) return 'love';
  if (hit(g.dislike)) return 'dislike';
  if (hit(g.like)) return 'like';
  return 'neutral';
}
function give(gm, id, itemId) {
  const S = gm.S, n = S.npcs[id];
  if (!n || !itemId || !count(S, itemId)) return null;
  if (D.ITEMS[itemId].kind === 'tool') return null;
  if (n.giftDay === S.day) { toast(gm, `You already gave ${D.PEOPLE[id].name.split(' ')[0]} a gift today.`); return { already: true }; }
  const r = giftReaction(id, itemId);
  removeItem(S, itemId, 1);
  n.giftDay = S.day;
  addPts(gm, id, { love: 12, like: 6, neutral: 2, dislike: -4 }[r]);
  sound(gm, r === 'dislike' ? 'nope' : 'gift');
  const first = D.PEOPLE[id].name.split(' ')[0];
  const text = { love: `${first} lights up. "I love this!"`, like: `${first} smiles. "Thank you."`, neutral: `${first} nods. "That's kind of you."`, dislike: `${first} frowns. "Oh. Well."` }[r];
  return { reaction: r, text };
}

// ---------- quests ----------
function questProgress(gm, q) {
  const S = gm.S, cs = S.cstats;
  switch (q.type) {
    case 'plant': return [cs.planted, q.n];
    case 'ship': return [cs.shippedKind[q.kind] || 0, q.n];
    case 'craft': return [cs.crafted[q.item] || 0, q.n];
    case 'place': return [cs.placed[q.item] || 0, q.n];
    case 'collect': return [cs.collected[q.item] || 0, q.n];
    case 'catch': return [cs.caught[q.item] || 0, q.n];
    case 'species': return [Object.keys(cs.caught).length, q.n];
    case 'earn': return [S.chapterEarned, q.n];
    case 'donate': return [cs.donated, q.n];
    case 'visit': return [cs.visited[q.place] ? 1 : 0, 1];
    case 'buyhouse': return [S.houseStyle === 'brick' ? 1 : 0, 1];
    case 'hearts': {
      if (q.npc === '*') { const c = Object.values(S.npcs).filter((n) => hearts(n.pts) >= q.n).length; return [c, q.count]; }
      return [hearts((S.npcs[q.npc] || { pts: 0 }).pts), q.n];
    }
    case 'deliver': { const e = Object.entries(q.items); return [e.reduce((a, [it, k]) => a + Math.min(k, count(S, it)), 0), e.reduce((a, [, k]) => a + k, 0)]; }
    case 'variety': { const ids = new Set(S.inv.filter((it) => it && D.ITEMS[it.id].kind === 'crop').map((it) => it.id)); return [Math.min(q.n, ids.size), q.n]; }
  }
  return [0, 1];
}
function progressText(gm, q) { const [a, b] = questProgress(gm, q); return `(${Math.min(a, b).toLocaleString('en-US')}/${b.toLocaleString('en-US')})`; }
function checkQuests(gm) {
  const S = gm.S;
  for (const q of D.QUESTS) {
    if (q.ch !== S.ch || !S.quests[q.id] || S.quests[q.id].done) continue;
    if (q.type === 'deliver' || q.type === 'variety') continue;
    const [a, b] = questProgress(gm, q);
    if (a >= b) completeQuest(gm, q);
  }
}
function completeQuest(gm, q) {
  const S = gm.S;
  S.quests[q.id].done = true; S.quests[q.id].day = S.day;
  if (q.reward.money) credit(gm, q.reward.money);
  if (q.reward.pts && q.giver) { const n = S.npcs[q.giver]; if (n) n.pts = Math.min(100, n.pts + q.reward.pts); }
  toast(gm, `${q.goal ? 'Goal' : 'Quest'} complete: ${q.title}${q.reward.money ? ` (+$${q.reward.money})` : ''}`, 'quest');
  sound(gm, 'quest');
  if (q.facts && q.facts.length) emit(gm, 'card', { title: q.title, facts: q.facts });
  if (goalsDone(S)) emit(gm, 'goals', { ch: S.ch });
}
const goalsFor = (ch) => D.QUESTS.filter((q) => q.ch === ch && q.goal);
const goalsDone = (S) => goalsFor(S.ch).every((q) => S.quests[q.id] && S.quests[q.id].done);

// ---------- days ----------
function sleep(gm, opts = {}) {
  const S = gm.S;
  const sum = { date: dateLabel(S), shipped: [], total: 0, rent: 0, wilted: 0, passOut: !!opts.passOut, lost: 0 };
  // Shipping.
  for (const e of S.bin) {
    const p = D.sellPrice(e.id, S.ch);
    sum.shipped.push({ id: e.id, n: e.n, each: p, total: p * e.n });
    sum.total += p * e.n;
    S.cstats.shipped[e.id] = (S.cstats.shipped[e.id] || 0) + e.n;
    const kind = D.ITEMS[e.id].kind; S.cstats.shippedKind[kind] = (S.cstats.shippedKind[kind] || 0) + e.n;
  }
  S.bin = [];
  if (sum.total) credit(gm, sum.total);
  if (S.ch === 1 && Object.values(S.objs).some((o) => o.t === 'hut')) { sum.rent = 8; credit(gm, 8); }
  if (Object.values(S.objs).some((o) => o.t === 'stand')) { sum.rent += 40; credit(gm, 40); }
  if (opts.passOut) { sum.lost = Math.min(100, Math.floor(S.money * 0.1)); S.money -= sum.lost; }
  // Crops grow where watered.
  for (const [k, c] of Object.entries(S.crops)) {
    if (c.dead) continue;
    if (S.soil[k] === 2) c.age++;
  }
  // Soil dries; bare tilled soil may revert.
  const dr = stream(S.seed, 'soil', S.ch, S.day);
  for (const k of Object.keys(S.soil)) {
    if (S.crops[k]) S.soil[k] = 1;
    else if (rnd(dr) < 0.15) delete S.soil[k];
    else S.soil[k] = 1;
  }
  // Animals produce if fed.
  for (const a of S.animals) {
    if (S.trough > 0) {
      S.trough--;
      const prod = D.ANIMALS[a.kind].product;
      S.penOut[prod] = (S.penOut[prod] || 0) + (a.petDay >= S.day - 1 && chance(S, 0.25) ? 2 : 1);
    }
  }
  S.day++; S.totalDays++;
  const newSea = season(S);
  if (S.day % D.DAYS_PER_SEASON === 0) {
    for (const c of Object.values(S.crops)) if (!c.dead && !D.CROPS[c.id].seasons.includes(newSea)) { c.dead = true; sum.wilted++; }
  }
  S.summary = sum;
  S.passOut = !!opts.passOut;
  startDay(gm, false);
  if (opts.passOut) S.energy = Math.round(S.maxEnergy * 0.6);
  S.player.x = 4.5; S.player.y = 13.9; S.player.face = 'down';
  emit(gm, 'slept', { summary: sum, turn: !!opts.turn });
  return sum;
}

function startDay(gm, first) {
  const S = gm.S;
  S.time = D.DAY_START; S.tick = 0; S.fishing = null; S.autoPath = null;
  S.energy = S.maxEnergy;
  const r = stream(S.seed, 'wx', S.ch, S.day);
  const sea = season(S);
  const p = { sp: 0.35, su: 0.22, fa: 0.25, wi: 0.25 }[sea];

  else { ctx.beginPath(); ctx.arc(cx, hy - u * 0.02, u * 0.22, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); }

    <div class="brand"><h1>Valley of Vapors</h1><div class="sub">Through the Ages</div></div>
    <div class="title-menu">
      ${hasSave ? `<button class="btn primary" data-act="continue" data-focus>Continue</button>` : `<button class="btn" disabled>Continue</button>`}
      <button class="btn ${hasSave ? '' : 'primary'}" data-act="newgame" ${hasSave ? '' : 'data-focus'}>New game</button>
      <button class="btn" data-act="open" data-arg="chapters">Chapter select</button>
      <button class="btn" data-act="open" data-arg="settings">Settings</button>
      <button class="btn" data-act="open" data-arg="help">Help</button>
      <button class="btn" data-act="open" data-arg="about">About</button>
    </div>
    ${saveInfo ? `<div class="title-note">${esc(saveInfo)}</div>` : ''}
    <div class="title-note">A farming and life sim across six eras of the Hot Springs valley. Characters and prices are game content; history cards cite their sources.</div>
  </div>`, 'title');
}

function chaptersScreen(reached) {
  show(`<div class="panel">${head('Chapter select')}
    <p class="muted small">Start a new save at the beginning of any chapter you have reached. This replaces the current save.</p>
    <ul class="list">${D.CHAPTERS.slice(1).map((c) => {
      const ok = reached.includes(c.n);
      return `<li class="li"><div class="grow"><b>${c.n}. ${esc(c.title)}</b> <span class="muted small">(${c.year})</span><div class="small muted">${ok ? esc(c.intro[0].slice(0, 110)) + '…' : 'Not reached yet.'}</div></div>
        <button class="btn sm" data-act="chapter" data-arg="${c.n}" ${ok ? '' : 'disabled'}>Play</button></li>`;
    }).join('')}</ul></div>`);
}

function helpScreen() {
  const k = app.settings.keys;
  const kb = (a) => k[a].map((x) => `<span class="kbd">${esc(keyName(x))}</span>`).join(' ');
  show(`<div class="panel">${head('Help')}
    <h3>Controls</h3>
    <table class="keys">
      <tr><td>Move</td><td>${kb('up')} ${kb('left')} ${kb('down')} ${kb('right')} · touch pad · tap a tile to walk there</td></tr>
      <tr><td>Use tool / item</td><td>${kb('use')} · <b>A</b> button · click or tap a tile next to you</td></tr>
      <tr><td>Talk / interact</td><td>${kb('talk')} · <b>B</b> button</td></tr>
      <tr><td>Hotbar</td><td><span class="kbd">1</span>–<span class="kbd">8</span>, ${kb('prev')} ${kb('next')}, mouse wheel, tap a slot</td></tr>
      <tr><td>Eat selected</td><td>${kb('eat')}</td></tr>
      <tr><td>Pack · Journal · Menu</td><td>${kb('inv')} · ${kb('journal')} · ${kb('pause')}</td></tr>
    </table>
    <h3>How to farm</h3>
    <p>Hoe the soil in your field, plant seeds that grow in the current season, and water them with the jug every day (rain does it for you). Ripe crops wear a ring badge. Put what you want to sell in the shipping bin by your house: it is paid overnight. Sleep to end the day; staying up past 2:00 costs money.</p>
    <p>Energy drops as you work. Eat food, soak in a hot pool once a day, or sleep. A whetstone made from ridge novaculite makes your tools cheaper to use.</p>
    <h3>Eras</h3>
    <p>Each chapter has five goals. When they are done, go to bed and choose <b>Sleep and turn the era</b>. A history card closes the chapter, the valley redraws in the next era, and the next generation of the Vale family takes over the farm. You can stay in a chapter as long as you like.</p>
    <h3>What is real</h3>
    <p>History cards and lines marked with a source are real and cite where they come from. <span class="tag">Legend</span> marks stories that historians say are not true. The Vale family, every neighbor, all prices, crop times and recipes are <b>game content</b>, invented for play.</p>
  </div>`);
}

function aboutScreen() {
  show(`<div class="panel">${head('About')}
    <p><b>Valley of Vapors: Through the Ages</b> is an original, open-source (MIT) farming and life sim, part of the Hot Springs Games collection. It is not affiliated with any park, business or commercial game.</p>
    <p>History comes from the collection's research corpus and the audited trivia bank (Encyclopedia of Arkansas, National Park Service, USGS, Wikipedia and others); each card names its source. Native history is presented from National Park Service and Encyclopedia of Arkansas sources; the old quarry in the game is a place to read about, not to dig.</p>
    <p>Code ideas: tilemaps (MDN), grid search (Red Blob Games), fixed-step loop pattern (MainLoop.js, Glenn Fiedler), mulberry32 PRNG (Tommy Ettinger, via bryc/code, public domain). Details in SAMPLES.md.</p>
    <p class="muted small">All art is drawn in code; all sounds are synthesized. Characters and prices are invented.</p>
  </div>`);
}

function pauseScreen(canSave) {
  show(`<div class="panel" style="max-width:24rem">${head('Paused')}
    <div style="display:grid;gap:8px">
      <button class="btn primary" data-act="close" data-focus>Resume</button>
      <button class="btn" data-act="save" ${canSave ? '' : 'disabled'}>Save now</button>
      <button class="btn" data-act="open" data-arg="journal">Journal</button>
      <button class="btn" data-act="open" data-arg="settings">Settings</button>
      <button class="btn" data-act="open" data-arg="help">Help</button>
      <button class="btn" data-act="title">Save and quit to title</button>
    </div>${canSave ? '' : '<p class="small muted">Saving is unavailable in this browser (storage blocked). Progress lasts until you close the page.</p>'}</div>`);
}

// ---------- inventory and crafting ----------
function inventoryScreen(gm, tab = 'items', pick = null) {
  const S = gm.S;
  const slots = S.inv.map((it, i) => `<button class="slot${i === S.sel ? ' sel' : ''}${i === pick ? ' pick' : ''}" data-act="slot" data-arg="${i}" aria-label="Slot ${i + 1}: ${it ? esc(D.itemName(it.id)) + ' ×' + it.n : 'empty'}">
    ${i < sim.HOTBAR ? `<span class="k">${i + 1}</span>` : ''}${it ? `<img alt="" src="${iconURL(it.id)}">${it.n > 1 ? `<span class="n">${it.n}</span>` : ''}` : ''}</button>`).join('');
  const it = pick != null ? S.inv[pick] : sim.selected(S);
  const det = it ? itemDetail(gm, it) : '<span class="muted">Select an item. Click two slots to swap them; slots 1–8 are the hotbar.</span>';
  const tabs = `<div class="tabs"><button class="tab ${tab === 'items' ? 'on' : ''}" data-act="invtab" data-arg="items">Pack</button><button class="tab ${tab === 'craft' ? 'on' : ''}" data-act="invtab" data-arg="craft">Crafting</button></div>`;
  let body;
  if (tab === 'craft') {
    body = `<ul class="list">${sim.recipesFor(S).map(([id, r]) => {
      const ok = sim.canCraft(S, id);
      const ins = Object.entries(r.in).map(([i, n]) => `<span class="${sim.count(S, i) >= n ? '' : 'muted'}">${n} ${esc(D.itemName(i).toLowerCase())} (${sim.count(S, i)})</span>`).join(', ');
      return `<li class="li"><img alt="" src="${iconURL(r.out[0])}"><div class="grow"><b>${esc(D.itemName(r.out[0]))}${r.out[1] > 1 ? ' ×' + r.out[1] : ''}</b><div class="small">${r.at === 'mill' ? 'At the creek mill: ' : ''}${ins}</div></div>
        ${r.at === 'pack' ? `<button class="btn sm ${ok ? 'primary' : ''}" data-act="craft" data-arg="${id}" ${ok ? '' : 'disabled'}>Craft</button>` : ''}</li>`;
    }).join('')}</ul><p class="small muted">Recipes are game content.</p>`;
  } else body = `<div class="grid">${slots}</div><div class="detail">${det}</div>`;
  show(`<div class="panel">${head('Pack', `<span class="muted">${money(S.money)}</span>`)}${tabs}${body}</div>`);
}
function itemDetail(gm, it) {
  const S = gm.S, def = D.ITEMS[it.id];
  const p = D.sellPrice(it.id, S.ch);
  const crop = def.kind === 'seed' ? D.CROPS[def.crop] : null;
  return `<div class="row"><img alt="" src="${iconURL(it.id)}" width="40" height="40"><div class="grow"><b>${esc(def.name)}</b> ×${it.n}
    <div class="small muted">${esc(kindLabel(def.kind))}${p ? ` · sells for ${money(p)}` : ''}${def.energy ? ` · +${def.energy} energy` : ''}${crop ? ` · ${crop.days} days, ${crop.seasons.map((s) => D.SEASON_NAME[s]).join('/')}${crop.regrow ? `, regrows every ${crop.regrow}` : ''}` : ''}${it.id === 'jug' ? ` · ${S.jug} water` : ''}</div></div>
    ${def.energy ? `<button class="btn sm" data-act="eat" data-arg="${it.id}">Eat</button>` : ''}</div>`;
}
const kindLabel = (k) => ({ tool: 'Tool', seed: 'Seeds', crop: 'Crop', forage: 'Foraged', fish: 'Fish', product: 'Farm product', material: 'Material', craft: 'Crafted good', food: 'Food', placeable: 'Place on your land' }[k] || k);

// ---------- shipping bin ----------
function binScreen(gm) {
  const S = gm.S;
  const sellable = S.inv.map((it, i) => ({ it, i })).filter(({ it }) => it && D.ITEMS[it.id].kind !== 'tool' && D.sellPrice(it.id, S.ch));
  const total = S.bin.reduce((a, e) => a + D.sellPrice(e.id, S.ch) * e.n, 0);
  show(`<div class="panel">${head('Shipping bin')}
    <p class="small muted">Items in the bin are sold overnight. Click an item to ship the whole stack; click a shipped item to take it back.</p>
    <div class="row spread"><h3>Your pack</h3><button class="btn sm" data-act="shipall">Ship all crops, fish and forage</button></div>
    <ul class="list">${sellable.map(({ it, i }) => `<li class="li"><img alt="" src="${iconURL(it.id)}"><div class="grow">${esc(D.itemName(it.id))} ×${it.n}</div><span class="price">${money(D.sellPrice(it.id, S.ch))} each</span><button class="btn sm" data-act="ship" data-arg="${i}">Ship</button></li>`).join('') || '<li class="muted">Nothing to ship.</li>'}</ul>
    <h3>In the bin · ${money(total)} tonight</h3>
    <ul class="list">${S.bin.map((e, i) => `<li class="li"><img alt="" src="${iconURL(e.id)}"><div class="grow">${esc(D.itemName(e.id))} ×${e.n}</div><span class="price">${money(D.sellPrice(e.id, S.ch) * e.n)}</span><button class="btn sm" data-act="unship" data-arg="${i}">Take back</button></li>`).join('') || '<li class="muted">Empty.</li>'}</ul>
  </div>`);
}

// ---------- chest ----------
function chestScreen(gm) {
  const S = gm.S;
  const cell = (it, act, i) => `<button class="slot" data-act="${act}" data-arg="${i}" aria-label="${it ? esc(D.itemName(it.id)) + ' ×' + it.n : 'empty'}">${it ? `<img alt="" src="${iconURL(it.id)}">${it.n > 1 ? `<span class="n">${it.n}</span>` : ''}` : ''}</button>`;
  show(`<div class="panel">${head('Chest')}<p class="small muted">Click an item to move it between your pack and the chest.</p>
    <h3>Chest</h3><div class="grid">${S.chest.map((it, i) => cell(it, 'cslot', i)).join('')}</div>
    <h3>Pack</h3><div class="grid">${S.inv.map((it, i) => cell(it, 'pslot', i)).join('')}</div></div>`);
}

// ---------- shop ----------
function shopScreen(gm, tab = 'buy') {
  const S = gm.S;
  const tabs = `<div class="tabs"><button class="tab ${tab === 'buy' ? 'on' : ''}" data-act="shoptab" data-arg="buy">Buy</button><button class="tab ${tab === 'sell' ? 'on' : ''}" data-act="shoptab" data-arg="sell">Sell</button></div>`;
  let body;
  if (tab === 'buy') {
    body = `<ul class="list">${sim.shopList(S).map((e) => {
      const name = e.name || D.itemName(e.id);
      const icon = e.id === 'animal' ? iconURL(D.ANIMALS[D.CHAPTERS[S.ch].animal].product) : e.id === 'brickhouse' ? iconURL('stone') : iconURL(e.id);
      const crop = e.id.startsWith('seed:') ? D.CROPS[e.id.slice(5)] : null;
      const one = e.id === 'animal' || e.id === 'brickhouse';
      return `<li class="li"><img alt="" src="${icon}"><div class="grow"><b>${esc(name)}</b>${crop ? `<div class="small muted">${crop.days} days · ${crop.seasons.map((s) => D.SEASON_NAME[s]).join('/')}${crop.regrow ? ` · regrows every ${crop.regrow}` : ''} · sells ${money(D.sellPrice(e.id.slice(5), S.ch))}</div>` : e.id === 'animal' ? `<div class="small muted">${S.animals.length}/${D.PEN_MAX} in the pen</div>` : ''}</div>
        <span class="price">${money(e.price)}</span><button class="btn sm" data-act="buy" data-arg="${e.id}|1" ${S.money >= e.price ? '' : 'disabled'}>Buy</button>${one ? '' : `<button class="btn sm" data-act="buy" data-arg="${e.id}|5" ${S.money >= e.price * 5 ? '' : 'disabled'}>×5</button>`}</li>`;
    }).join('')}</ul>`;
  } else {
    const items = S.inv.filter((it) => it && D.ITEMS[it.id].kind !== 'tool' && D.sellPrice(it.id, S.ch));
    const seen = new Set();
    body = `<ul class="list">${items.filter((it) => !seen.has(it.id) && seen.add(it.id)).map((it) => `<li class="li"><img alt="" src="${iconURL(it.id)}"><div class="grow">${esc(D.itemName(it.id))} ×${sim.count(S, it.id)}</div><span class="price">${money(D.sellPrice(it.id, S.ch))}</span>
      <button class="btn sm" data-act="sell" data-arg="${it.id}|1">Sell 1</button><button class="btn sm" data-act="sell" data-arg="${it.id}|99">All</button></li>`).join('') || '<li class="muted">Nothing to sell.</li>'}</ul>`;
  }
  show(`<div class="panel">${head(D.SHOPS[S.ch].name, `<span class="muted">${money(S.money)}</span>`)}${tabs}${body}<p class="small muted">Prices are game prices, not historical ones.</p></div>`);
}

// ---------- journal ----------
function journalScreen(gm, tab = 'goals') {
  const S = gm.S, C = D.CHAPTERS[S.ch];
  const tabs = ['goals', 'quests', 'people', 'almanac'].map((t) => `<button class="tab ${tab === t ? 'on' : ''}" data-act="jtab" data-arg="${t}">${{ goals: 'Goals', quests: 'Quests', people: 'People', almanac: 'Almanac' }[t]}</button>`).join('');
  let body = '';
  const qli = (q) => { const st = S.quests[q.id]; return `<li class="li ${st.done ? 'done' : ''}"><div class="grow"><b>${st.done ? '✓' : '◇'} ${esc(q.title)}</b> ${q.giver ? `<span class="small muted">· ${esc(D.PEOPLE[q.giver].name)}</span>` : ''}<div class="small">${esc(q.desc)}</div></div><span class="small">${st.done ? 'Done' : esc(sim.progressText(gm, q))}</span></li>`; };
  if (tab === 'goals') {
    body = `<p><b>Chapter ${S.ch}: ${esc(C.title)}</b> <span class="muted">(${C.year}, ${esc(C.who)})</span></p>
      <ul class="list">${sim.goalsFor(S.ch).map(qli).join('')}</ul>
      <p class="small">${sim.goalsDone(S) ? (S.ch === 6 ? '<b>Every goal is done.</b> Go to bed and choose “Finish the story”.' : '<b>All goals done.</b> Go to bed and choose “Sleep and turn the era”.') : 'Finish all five goals to turn the era.'}</p>`;
  } else if (tab === 'quests') {
    body = `<ul class="list">${D.QUESTS.filter((q) => q.ch === S.ch && !q.goal).map(qli).join('')}</ul>`;
  } else if (tab === 'people') {
    body = `<ul class="list">${Object.entries(S.npcs).map(([id, n]) => { const p = D.PEOPLE[id], h = sim.hearts(n.pts); return `<li class="li"><canvas class="pp" data-pid="${id}" width="36" height="48" aria-hidden="true"></canvas><div class="grow"><b>${esc(p.name)}</b><div class="small muted">${esc(p.role)}</div><div class="small">Loves: ${p.gifts.love.map((g) => esc(giftName(g))).join(', ')}</div></div><span class="hearts" aria-label="${h} of 5 hearts">${'♥'.repeat(h)}${'♡'.repeat(5 - h)}</span></li>`; }).join('')}</ul><p class="small muted">Talk once a day and give one gift a day to make friends. All people are fictional.</p>`;
  } else {
    const ids = S.almanac;
    body = ids.length ? ids.map((id) => factHtml(id)).join('') : '<p class="muted">Facts you read on history cards and signs collect here.</p>';
    body = `<p class="small muted">${ids.length} of ${FACT.size} facts collected.</p>` + body;
  }
  show(`<div class="panel">${head('Journal')}<div class="tabs">${tabs}</div>${body}</div>`);
  document.querySelectorAll('canvas.pp').forEach((c) => { const id = c.dataset.pid; const ctx = c.getContext('2d'); ctx.drawImage(personSprite(id, D.PEOPLE[id].look, 'down', 0, 64), 0, 0, 36, 48); });
}
const giftName = (g) => (g.startsWith('kind:') ? 'any ' + g.slice(5) : D.itemName(g).toLowerCase());
function factHtml(id) {
  const f = FACT.get(id);
  if (!f) return '';
  return `<div class="fact">${f.legend ? '<span class="tag">Legend</span>' : ''}${esc(f.text)}<span class="src">Source: ${esc(f.source)} · ${esc(f.sourceUrl)}</span></div>`;
}

// ---------- settings ----------
const ACTIONS = { up: 'Move up', down: 'Move down', left: 'Move left', right: 'Move right', use: 'Use tool / item', talk: 'Talk / interact', eat: 'Eat selected', prev: 'Previous hotbar slot', next: 'Next hotbar slot', inv: 'Pack', journal: 'Journal', pause: 'Menu / close' };
function keyName(code) { return code.replace(/^Key/, '').replace(/^Digit/, '').replace('Arrow', '').replace('Space', 'Space').replace('Escape', 'Esc'); }
function settingsScreen(waiting) {
  const s = app.settings;
  const opt = (act, val, cur, label) => `<button class="tab ${cur === val ? 'on' : ''}" data-act="${act}" data-arg="${val}" aria-pressed="${cur === val}">${label}</button>`;
  show(`<div class="panel">${head('Settings')}
    <h3>Text size</h3><div class="tabs">${opt('text', '1', String(s.text), '100%')}${opt('text', '1.25', String(s.text), '125%')}${opt('text', '1.5', String(s.text), '150%')}</div>
    <h3>Motion</h3><div class="tabs">${opt('motion', 'auto', s.motion, 'Follow system')}${opt('motion', 'reduced', s.motion, 'Reduced')}${opt('motion', 'full', s.motion, 'Full')}</div>
    <h3>Touch controls</h3><div class="tabs">${opt('touch', 'auto', s.touch, 'Auto')}${opt('touch', 'on', s.touch, 'Always show')}${opt('touch', 'off', s.touch, 'Hide')}</div>
    <h3>Sound</h3><div class="tabs">${opt('mute', 'off', s.mute ? 'on' : 'off', 'Sound on')}${opt('mute', 'on', s.mute ? 'on' : 'off', 'Muted')}${opt('vol', '0.25', String(s.volume), 'Quiet')}${opt('vol', '0.5', String(s.volume), 'Normal')}${opt('vol', '1', String(s.volume), 'Loud')}</div>
    <h3>Assists</h3><div class="tabs">${opt('assist', 'on', s.assist ? 'on' : 'off', 'Wider fishing window')}${opt('assist', 'off', s.assist ? 'on' : 'off', 'Normal window')}${opt('contrast', 'on', s.contrast ? 'on' : 'off', 'High-contrast HUD')}${opt('contrast', 'off', s.contrast ? 'on' : 'off', 'Standard HUD')}</div>
    <h3>Keys</h3>
    <table class="keys">${Object.entries(ACTIONS).map(([a, label]) => `<tr><td>${label}</td><td>${s.keys[a].map((k) => `<span class="kbd">${esc(keyName(k))}</span>`).join(' ')}</td><td><button class="btn sm" data-act="rebind" data-arg="${a}">${waiting === a ? 'Press a key…' : 'Change'}</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="resetkeys">Reset keys</button></div>
  </div>`);
}

// ---------- dialogue and prompts ----------
function dialogScreen(d, gm) {
  const S = gm.S;
  const sel = sim.selected(S);
  const canGive = sel && D.ITEMS[sel.id].kind !== 'tool';
  const facts = (d.facts || []).map(factHtml).join('');
  show(`<div class="dialog" role="dialog" aria-label="${esc(d.name)}"><canvas class="portrait" width="84" height="112" aria-hidden="true"></canvas>
    <div class="panel"><div class="row spread"><div><div class="who">${esc(d.name)} <span class="hearts small" aria-label="${d.hearts} hearts">${'♥'.repeat(d.hearts)}${'♡'.repeat(5 - d.hearts)}</span></div><div class="role">${esc(d.role)}</div></div></div>
    ${d.lines.map((l, i) => `<p class="text">${d.legend && i === d.lines.length - 1 ? '<span class="tag">Legend</span>' : ''}${esc(l)}</p>`).join('')}
    ${(d.reminders || []).map((r) => `<p class="text small"><span class="tag">Request</span>${esc(r)}</p>`).join('')}
    ${d.giftText ? `<p class="text"><i>${esc(d.giftText)}</i></p>` : ''}
    ${facts ? `<details><summary class="small">Source</summary>${facts}</details>` : ''}
    <div class="row">${canGive && !d.giftText ? `<button class="btn" data-act="give" data-arg="${d.npc}">Give ${esc(D.itemName(sel.id).toLowerCase())}</button>` : ''}<button class="btn primary" data-act="close" data-focus>Bye</button></div></div></div>`, 'dlg');
  const c = document.querySelector('.dialog .portrait');
  if (c) { const ctx = c.getContext('2d'); ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(0, 0, 84, 112); ctx.drawImage(personSprite(d.npc, D.PEOPLE[d.npc].look, 'down', 0, 80), 2, -6, 80, 120); }
}
function bedScreen(gm) {
  const S = gm.S;
  const turn = sim.goalsDone(S);
  show(`<div class="panel" style="max-width:28rem"><h2>Go to bed?</h2>
    <p>It is ${sim.clock(S)}. Sleeping ends the day: shipped items are paid, crops grow, and the game saves.</p>
    ${turn ? `<p><b>${S.ch === 6 ? 'Every goal of the last chapter is done.' : 'All five goals are done.'}</b> ${S.ch === 6 ? 'You can finish the story tonight.' : `You can turn the era tonight: the farm passes to the next generation in ${D.CHAPTERS[S.ch + 1].year}.`}</p>` : ''}
    <div style="display:grid;gap:8px">${turn ? `<button class="btn primary" data-act="sleepturn" data-focus>${S.ch === 6 ? 'Sleep and finish the story' : 'Sleep and turn the era'}</button>` : ''}
      <button class="btn ${turn ? '' : 'primary'}" data-act="sleep" ${turn ? '' : 'data-focus'}>Sleep</button><button class="btn" data-act="close">Not yet</button></div></div>`);
}
function fundScreen(gm) {
  const S = gm.S, q = sim.QUEST['c6-fund'], st = S.quests['c6-fund'];
  show(`<div class="panel" style="max-width:30rem">${head('Restoration fund')}
    ${factHtml('f-maurice')}
    <p>Raised from you so far: <b>${money(S.cstats.donated)}</b> of the ${money(q.n)} goal (game).</p>
    <div class="row">${[250, 500, 1000].map((a) => `<button class="btn" data-act="donate" data-arg="${a}" ${S.money >= a ? '' : 'disabled'}>Give ${money(a)}</button>`).join('')}</div>
    ${st && st.done ? '<p><b>Goal met. Thank you!</b></p>' : ''}</div>`);
}
function signScreen(kind, gm) {
  if (kind === 'quarry') {
    show(`<div class="panel" style="max-width:34rem">${head('The old quarry')}

        case 'render': render(); return true;
      }
      return null;
    })();
    drainEvents(); if (app.ui.scene === 'game' && app.gm) render();
    return r && typeof r === 'object' ? JSON.parse(JSON.stringify(r)) : r;
  },
};
window.__game = hooks;

// ---------- boot ----------
function boot() {
  app.storageOK = probeStorage();
  app.settings = loadSettings();
  scene.setup(document.getElementById('view'));
  ui.init(app, typeof FACTS !== 'undefined' ? FACTS.facts : []);
  applySettings();
  setupTouch();
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { app.held.clear(); app.pad.x = app.pad.y = 0; });
  document.getElementById('view').addEventListener('pointerdown', canvasPointer);
  document.getElementById('view').addEventListener('wheel', (e) => { if (app.gm && !app.ui.modal && app.ui.scene === 'game') { app.gm.S.sel = (app.gm.S.sel + (e.deltaY > 0 ? 1 : sim.HOTBAR - 1)) % sim.HOTBAR; e.preventDefault(); } }, { passive: false });
  document.getElementById('app').addEventListener('click', onClick);
  window.addEventListener('resize', () => { scene.resize(); app.lastRenderTitle = false; app.dirty = true; layoutVisibility(); });
  if (window.matchMedia) window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', applySettings);
  toTitle();
  if (!app.storageOK) ui.toast('Saving is unavailable in this browser. You can still play.', 'warn');
  app.loadMs = Math.round(performance.now() - T0);
  requestAnimationFrame(frame);
}
boot();

return {  };
})();
</script>
